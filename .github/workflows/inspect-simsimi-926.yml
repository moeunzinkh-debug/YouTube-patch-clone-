name: Inspect uploaded SimSimi 9.2.6
on:
  workflow_dispatch:
  push:
    branches: [arena/2d29b958-youtube-patch-clone]
    paths: ['.github/workflows/inspect-simsimi-926.yml', 'tools/simsimi/inspect_926.py']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact uploaded APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/simsimi-926
          gh release download Simsimi --pattern Simsimi_9.2.6.apk --dir /tmp/simsimi-926
          echo '756ffb436399d6f74b2f05b234b89a9d7b15ba40bbbcb3c7b6ff2913a288556e  /tmp/simsimi-926/Simsimi_9.2.6.apk' | sha256sum --check
      - name: Compare metadata, Hermes, app classes, and navigation targets
        run: |
          python3 -m pip install 'androguard==4.1.3'
          python3 tools/simsimi/inspect_926.py /tmp/simsimi-926/Simsimi_9.2.6.apk /tmp/simsimi-926/report.json | tee /tmp/simsimi-926/summary.log
          cat /tmp/simsimi-926/summary.log >> "$GITHUB_STEP_SUMMARY"
      - name: List current bundle selectors for 9.2.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop --pattern morphe-desktop-1.19.1-all.jar --dir /tmp/simsimi-926
          echo 'a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  /tmp/simsimi-926/morphe-desktop-1.19.1-all.jar' | sha256sum --check
          java -Xmx2g -jar /tmp/simsimi-926/morphe-desktop-1.19.1-all.jar list-patches \
            --patches bundles/simsimi/bundle.mpp --with-packages --with-versions --include-experimental \
            --out /tmp/simsimi-926/patches.txt
          python3 tools/simsimi/verify_listing.py /tmp/simsimi-926/patches.txt
      - name: Apply actual current bundle to 9.2.6
        run: |
          set -o pipefail
          java -Xmx4g -jar /tmp/simsimi-926/morphe-desktop-1.19.1-all.jar patch /tmp/simsimi-926/Simsimi_9.2.6.apk \
            -p bundles/simsimi/bundle.mpp \
            -e 'Quick return: double-tap Chat (experimental)' \
            -e 'MicroG RE service routing (experimental)' \
            -e 'Daily bonus without video (client path, experimental)' \
            -e 'Conversation level controls (client only, experimental)' \
            -e 'Profile photo controls (client only, experimental)' \
            -e 'Custom group cover controls (client only, experimental)' \
            -e 'Photo sending controls (client only, experimental)' \
            -e 'Read receipt display (client only, experimental)' \
            -e 'Membership item controls (client only, experimental)' \
            --unsigned -o /tmp/simsimi-926/patched.apk -r /tmp/simsimi-926/patch-result.json \
            2>&1 | tee /tmp/simsimi-926/patch.log
          sha256sum /tmp/simsimi-926/patched.apk
      - name: Print diagnostic result
        if: always()
        run: |
          echo '--- static report ---'
          test ! -f /tmp/simsimi-926/report.json || cat /tmp/simsimi-926/report.json
          echo '--- Morphe patch result ---'
          test ! -f /tmp/simsimi-926/patch-result.json || cat /tmp/simsimi-926/patch-result.json
          echo '--- Morphe log tail ---'
          test ! -f /tmp/simsimi-926/patch.log || tail -n 100 /tmp/simsimi-926/patch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simsimi-926-static-inspection
          path: |
            /tmp/simsimi-926/report.json
            /tmp/simsimi-926/patch-result.json
            /tmp/simsimi-926/patches.txt
            /tmp/simsimi-926/summary.log
