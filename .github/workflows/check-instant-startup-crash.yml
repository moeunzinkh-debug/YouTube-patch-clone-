name: Check Instant Translate startup crash

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - '.github/workflows/check-instant-startup-crash.yml'
      - 'tools/instant-translate/probe_startup.py'
      - 'tools/instant-translate/compare_startup.py'
      - 'tools/instant-translate/test_probe_startup.py'

permissions:
  contents: read

concurrency:
  group: instant-startup-crash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: contains(github.event.head_commit.message, '[instant-crash]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_BUNDLE_SHA256: 4fe99fee6a9ea32887fdb00c694dbb3b2685424dcbe1cff0b4bb770d03ede859
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate report helpers and download pinned release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/instant-translate/test_probe_startup.py -v
          python3 tools/instant-translate/verify_bundle.py --mpp bundles/instant-translate/bundle.mpp
          mkdir -p /tmp/instant-manager "$RUNNER_TEMP/instant-crash"
          gh release download Instant-translate --pattern 'Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk' \
            --pattern bundle.mpp --pattern bundle.mpp.sha256 --dir /tmp/instant-manager
          gh release download v2.3.0-dev.3 --repo MorpheApp/morphe-manager --pattern morphe-manager-2.3.0-dev.3.apk --dir /tmp/instant-manager
          name='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          echo 'f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  /tmp/instant-manager/'"$name" | sha256sum --check
          echo '9b9cbd8d3e0c4394f87c1a5675db6ff2e473233e316bf2915f6fe447347e5d96  /tmp/instant-manager/morphe-manager-2.3.0-dev.3.apk' | sha256sum --check
          (cd /tmp/instant-manager && sha256sum --check bundle.mpp.sha256)
          echo "$EXPECTED_BUNDLE_SHA256  /tmp/instant-manager/bundle.mpp" | sha256sum --check
          cmp /tmp/instant-manager/bundle.mpp bundles/instant-translate/bundle.mpp
      - name: Re-sign the original APK as an unchanged-DEX control
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/instant-crash"
          input='/tmp/instant-manager/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          keytool -genkeypair -keystore "$dir/test.jks" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Emulator Test' >/dev/null 2>&1
          "$tools/zipalign" -f -p 4 "$input" "$dir/control-aligned.apk"
          "$tools/apksigner" sign --ks "$dir/test.jks" --ks-pass pass:android --key-pass pass:android \
            --out "$dir/control-resigned.apk" "$dir/control-aligned.apk"
          "$tools/apksigner" verify --min-sdk-version 29 "$dir/control-resigned.apk"
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          original = Path('/tmp/instant-manager/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk')
          control = Path(os.environ['RUNNER_TEMP'], 'instant-crash', 'control-resigned.apk')
          def tracked(path):
              with zipfile.ZipFile(path) as source:
                  return {name: hashlib.sha256(source.read(name)).hexdigest() for name in source.namelist()
                          if name.endswith('.dex') or name.startswith('lib/')}
          first, second = tracked(original), tracked(control)
          if not first or first != second:
              raise SystemExit('DEX or native-library contents changed in re-sign control')
          print('Control DEX and native-library bytes are identical to the original')
          PY
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Compare original, re-signed control and actual Manager output
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            python3 tools/instant-translate/test_manager.py
            INSTANT_DISPOSABLE_EMULATOR=1 INSTANT_STARTUP_MODE=original INSTANT_STARTUP_APK='/tmp/instant-manager/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk' INSTANT_STARTUP_REPORT="$RUNNER_TEMP/instant-crash/original.json" python3 tools/instant-translate/probe_startup.py
            INSTANT_DISPOSABLE_EMULATOR=1 INSTANT_STARTUP_MODE=resigned_control INSTANT_STARTUP_APK="$RUNNER_TEMP/instant-crash/control-resigned.apk" INSTANT_STARTUP_REPORT="$RUNNER_TEMP/instant-crash/control.json" python3 tools/instant-translate/probe_startup.py
            INSTANT_DISPOSABLE_EMULATOR=1 INSTANT_STARTUP_MODE=manager_patched INSTANT_STARTUP_APK='/tmp/instant-manager/manager-merged-patched.apk' INSTANT_STARTUP_REPORT="$RUNNER_TEMP/instant-crash/manager.json" python3 tools/instant-translate/probe_startup.py
      - name: Validate Manager output and summarize startup observations
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          "$tools/apksigner" verify --min-sdk-version 29 /tmp/instant-manager/manager-merged-patched.apk
          python3 tools/instant-translate/verify_manager.py \
            '/tmp/instant-manager/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk' \
            /tmp/instant-manager/manager-merged-patched.apk bundles/instant-translate/bundle.mpp \
            "$RUNNER_TEMP/instant-crash/manager-validation.json" > "$RUNNER_TEMP/instant-crash/verify.log" 2>&1 || {
              tail -n 20 "$RUNNER_TEMP/instant-crash/verify.log"; exit 1;
            }
          python3 - "$tools/apksigner" <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/instant-translate')
          from inspect_apk import signature
          directory = Path(os.environ['RUNNER_TEMP'], 'instant-crash')
          files = {
              'original': Path('/tmp/instant-manager/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'),
              'resigned_control': directory / 'control-resigned.apk',
              'manager_patched': Path('/tmp/instant-manager/manager-merged-patched.apk'),
          }
          signatures = {name: signature(sys.argv[1], path, '29') for name, path in files.items()}
          if not all(item['verified'] and len(item['signer_sha256']) == 1 for item in signatures.values()):
              raise SystemExit('An APK does not have exactly one verified signer')
          original = signatures['original']['signer_sha256'][0]
          result = {'original_signer_sha256': original,
                    'resigned_control_matches_original': signatures['resigned_control']['signer_sha256'][0] == original,
                    'manager_patched_matches_original': signatures['manager_patched']['signer_sha256'][0] == original}
          (directory / 'signatures.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          python3 tools/instant-translate/compare_startup.py "$RUNNER_TEMP/instant-crash/original.json" \
            "$RUNNER_TEMP/instant-crash/control.json" "$RUNNER_TEMP/instant-crash/manager.json" \
            "$RUNNER_TEMP/instant-crash/manager-validation.json" "$RUNNER_TEMP/instant-crash/signatures.json" \
            bundles/instant-translate/bundle.mpp "$RUNNER_TEMP/instant-crash/summary.json"
      - name: Report sanitized startup diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'], 'instant-crash')
          for name in ('original', 'control', 'manager', 'summary'):
              path = directory / (name + '.json')
              if not path.exists():
                  print('::warning::No startup report for ' + name)
                  continue
              data = base64.b64encode(gzip.compress(path.read_bytes())).decode()
              chunks = [data[i:i+3900] for i in range(0, len(data), 3900)]
              if len(chunks) > 8:
                  print('::warning::Startup report too large for annotations: ' + name)
                  continue
              for i, chunk in enumerate(chunks, 1):
                  print(f'::notice::INSTANT_CRASH_{name.upper()} {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-startup-crash-diagnostics
          path: |
            ${{ runner.temp }}/instant-crash/original.json
            ${{ runner.temp }}/instant-crash/control.json
            ${{ runner.temp }}/instant-crash/manager.json
            ${{ runner.temp }}/instant-crash/manager-validation.json
            ${{ runner.temp }}/instant-crash/signatures.json
            ${{ runner.temp }}/instant-crash/summary.json
          if-no-files-found: ignore
