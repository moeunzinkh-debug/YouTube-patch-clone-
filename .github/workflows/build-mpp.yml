name: Build patch.mpp

# A .mpp is a compiled Morphe Patch Package (JAR + DEX), not a source archive.
# It has to be produced by the Morphe Gradle plugin with JDK 21 + Android SDK,
# so the real build runs here in CI and the result is uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this build was triggered'
        required: false
        default: 'manual build'
  push:
    branches:
      - arena/a06798d3-youtube-patch-clone
      - arena/83fe2f55-youtube-patch-clone
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-mpp.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: build-patch-mpp
  cancel-in-progress: false

jobs:
  build:
    name: Compile patches + extensions into patch.mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" 2>/dev/null | tail -8 || true

      # buildAndroid adds the extension DEX to the jar in place, so it must be
      # the last Gradle task (a later JVM task would rewrite the archive).
      - name: Build Android patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace 2>&1 | tee /tmp/mpp-build.log

      - name: Report build failure
        if: failure()
        run: |
          # Surface compiler/runtime errors as check-run annotations so they are
          # readable through the GitHub API without downloading the full log.
          grep -E 'error:|FAILED|FAILURE:|What went wrong|Execution failed' /tmp/mpp-build.log \
            | tail -25 | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Normalize artifact name and checksum
        run: |
          set -e
          ls -lh patches/build/libs
          bundle="$(ls patches/build/libs/patches-*.mpp | head -n 1)"
          cp "$bundle" patch.mpp
          sha256sum patch.mpp > patch.mpp.sha256
          echo "Bundle: $bundle"
          echo "Entries:"
          unzip -l patch.mpp | head -25
          echo "SHA256:"
          cat patch.mpp.sha256

      - name: Upload patch.mpp
        uses: actions/upload-artifact@v4
        with:
          name: patch-mpp
          path: |
            patch.mpp
            patch.mpp.sha256
          if-no-files-found: error
          retention-days: 30

      # The Arena sandbox cannot reach the Actions artifact host, so also put
      # the compiled bundle on the branch itself. It is fetched with a normal
      # git pull. patch.mpp is not in the push path filter, so this commit
      # cannot re-trigger this workflow.
      - name: Publish bundle to this branch
        if: success()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f patch.mpp patch.mpp.sha256
          if git diff --cached --quiet; then
            echo 'Bundle unchanged, nothing to commit.'
          else
            git commit -m 'build: publish compiled patch.mpp bundle [skip ci]'
            git push
          fi
