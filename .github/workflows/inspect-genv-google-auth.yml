name: Inspect GenV Google authentication and MicroG compatibility

on:
  push:
    branches: [arena/3655779f-youtube-patch-clone]
    paths:
      - 'tools/genv/inspect_google_auth.py'
      - 'tools/genv/test_inspect_google_auth.py'
      - '.github/workflows/inspect-genv-google-auth.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[genv-auth-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test privacy and input guards
        run: |
          python3 tools/genv/test_inspect_genv.py -v
          python3 tools/genv/test_inspect_google_auth.py -v
      - name: Inspect pinned release base APK without changing, uploading or executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          mkdir -p "$RUNNER_TEMP/genv-auth"
          gh release download GenV --pattern GenV_3.7.2.apk --dir "$RUNNER_TEMP/genv-auth"
          apk="$RUNNER_TEMP/genv-auth/GenV_3.7.2.apk"
          echo 'f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e  '"$apk" | sha256sum --check
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$tools/apksigner"
          if ! python3 tools/genv/inspect_google_auth.py "$apk" "$RUNNER_TEMP/genv-auth/report.json" \
              --apksigner "$tools/apksigner" > "$RUNNER_TEMP/genv-auth/inspect.log" 2>&1; then
            tail -n 25 "$RUNNER_TEMP/genv-auth/inspect.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/genv-auth/inspect.log"
      - name: Emit bounded sanitized evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'genv-auth/report.json').read_text())
          def encode(): return base64.b64encode(gzip.compress(json.dumps(report,ensure_ascii=False).encode())).decode()
          payload=encode()
          if len(payload)>35000:
              report['auth_bridge_classes']=report['auth_bridge_classes'][:70]
              report['gms_routing_sites']={k:v[:25] for k,v in report['gms_routing_sites'].items()}
              report['auth_api_calls']={k:v[:20] for k,v in report['auth_api_calls'].items()}
              payload=encode()
          if len(payload)>35000:
              report['gms_routing_sites']={k:v[:10] for k,v in report['gms_routing_sites'].items()}
              report['auth_api_calls']={k:v[:5] for k,v in report['auth_api_calls'].items()}
              payload=encode()
          chunks=[payload[i:i+3900] for i in range(0,len(payload),3900)]
          if len(chunks)>10: raise SystemExit('Sanitized inspection report exceeds annotation limit')
          for i,chunk in enumerate(chunks,1): print(f'::notice::GENV_AUTH {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genv-google-auth-inspection
          if-no-files-found: error
          path: ${{ runner.temp }}/genv-auth/report.json
