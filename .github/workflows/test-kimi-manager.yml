name: Test Kimi APKS in Morphe Manager

on:
  push:
    branches: [arena/008b2974-youtube-patch-clone]
    paths:
      - '.github/workflows/test-kimi-manager.yml'
      - 'tools/kimi/test_manager.py'
      - 'tools/kimi/verify_manager_output.py'

permissions:
  contents: write

concurrency:
  group: kimi-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manager:
    if: contains(github.event.head_commit.message, '[kimi-manager]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Manager and supplied split archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kimi-manager
          gh release download v2.3.0-dev.3 --repo MorpheApp/morphe-manager --pattern morphe-manager-2.3.0-dev.3.apk --dir /tmp/kimi-manager
          gh release download Kimi --pattern 'Kimi.v.3.1.5.b.381.minSDK26.MultiPatch.apks' --dir /tmp/kimi-manager
          echo '9b9cbd8d3e0c4394f87c1a5675db6ff2e473233e316bf2915f6fe447347e5d96  /tmp/kimi-manager/morphe-manager-2.3.0-dev.3.apk' | sha256sum --check
          echo '7000c991b9e745ccd1d1ecffaff71c2295094cb4a7fce213d3ce1d3310050304  /tmp/kimi-manager/Kimi.v.3.1.5.b.381.minSDK26.MultiPatch.apks' | sha256sum --check
          unzip -p /tmp/kimi-manager/Kimi.v.3.1.5.b.381.minSDK26.MultiPatch.apks base.apk > /tmp/kimi-manager/base.apk
          echo 'b7a5a412ed6958823da4b513523a22da2b032578f651fd9f9d4d08e4fc0ff85d  /tmp/kimi-manager/base.apk' | sha256sum --check
          python3 tools/kimi/verify_bundle.py --mpp bundles/kimi/bundle.mpp
      - name: Enable emulator acceleration when available
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Patch the supplied APKS in Manager without running Kimi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/kimi/test_manager.py
      - name: Verify Manager-saved merged APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          "$tools/apksigner" verify --min-sdk-version 26 /tmp/kimi-manager/manager-merged-patched.apk
          if ! python3 tools/kimi/verify_manager_output.py /tmp/kimi-manager/base.apk \
            /tmp/kimi-manager/manager-merged-patched.apk bundles/kimi/bundle.mpp \
            /tmp/kimi-manager/manager-smoke.json > /tmp/kimi-manager/verify.log 2>&1; then
            tail -n 15 /tmp/kimi-manager/verify.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo '::notice::Morphe Manager patched the supplied split archive and the saved APK has the expected PairIP edits'
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-manager-validation
          path: /tmp/kimi-manager/manager-smoke.json
      - name: Save the sanitized validation report only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          for source in bundles/kimi/bundle.mpp tools/kimi/test_manager.py tools/kimi/verify_manager_output.py .github/workflows/test-kimi-manager.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$source")" != "$(git rev-parse "HEAD:$source")" ]; then
              echo '::warning::Manager test input changed; not saving stale results.'
              exit 0
            fi
          done
          cp /tmp/kimi-manager/manager-smoke.json bundles/kimi/manager-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundles/kimi/manager-smoke.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record Kimi Manager split patch validation [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
