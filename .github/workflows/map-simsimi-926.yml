name: Map SimSimi 9.2.6 patch targets
on:
  push:
    branches: [arena/2d29b958-youtube-patch-clone]
    paths: ['.github/workflows/map-simsimi-926.yml', 'tools/simsimi/map_926_targets.py']
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Download exact APK and pinned analysis tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/simsimi-926
          gh release download Simsimi --pattern Simsimi_9.2.6.apk --dir /tmp/simsimi-926
          echo '756ffb436399d6f74b2f05b234b89a9d7b15ba40bbbcb3c7b6ff2913a288556e  /tmp/simsimi-926/Simsimi_9.2.6.apk' | sha256sum --check
          git clone --filter=blob:none https://github.com/P1sec/hermes-dec.git /tmp/hermes-dec
          git -C /tmp/hermes-dec checkout 2e796663e1fedb93dca51060797ebf3327b3fedb
          python3 -m pip install /tmp/hermes-dec 'androguard==4.1.3'
      - name: Generate target evidence
        run: |
          python3 tools/simsimi/map_926_targets.py \
            /tmp/simsimi-926/Simsimi_9.2.6.apk docs/simsimi/926-target-analysis.json
      - name: Save non-APK analysis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/simsimi/926-target-analysis.json
          git commit -m 'analysis: map SimSimi 9.2.6 targets [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: simsimi-926-target-analysis
          path: docs/simsimi/926-target-analysis.json
