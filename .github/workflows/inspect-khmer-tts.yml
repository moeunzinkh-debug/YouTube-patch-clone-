name: Inspect Khmer FastAPI TTS schema
on:
  push:
    branches: [arena/6b029760-youtube-patch-clone]
    paths: ['.github/workflows/inspect-khmer-tts.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch public FastAPI schema (no synthesis request)
        run: |
          mkdir -p docs/diagnostics
          python3 - <<'PY'
          import datetime, json, urllib.request
          from pathlib import Path
          url = 'https://takumi0002-tts-kh.hf.space/openapi.json'
          report = {'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'url': url}
          try:
              request = urllib.request.Request(url, headers={'Accept':'application/json', 'User-Agent':'YouTube-Patch-Clone-Diagnostics/1.0'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  report['status'] = response.status
                  data = response.read(2 * 1024 * 1024 + 1)
                  assert len(data) <= 2 * 1024 * 1024, 'Schema size limit exceeded'
                  schema = json.loads(data)
              Path('docs/diagnostics/khmer-tts-openapi.json').write_text(json.dumps(schema, indent=2, ensure_ascii=False) + '\n')
              report['paths'] = list(schema.get('paths', {}))
          except Exception as exc:
              report['error'] = str(exc)
          Path('docs/diagnostics/khmer-tts-check.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Probe direct POST with bounded test requests
        run: |
          python3 - <<'PYCODE'
          import datetime, json, urllib.request, urllib.error
          from pathlib import Path
          base = 'https://takumi0002-tts-kh.hf.space'
          report = {'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'tests': []}
          probes = [('health', '/api/health', None),
                    ('post_empty_json', '/api/process-multi', {}),
                    ('post_text_json', '/api/process-multi', {'text': 'សួស្តី នេះជាការសាកល្បងសំឡេង។'})]
          for name, path, body in probes:
              item = {'name': name, 'method': 'GET' if body is None else 'POST', 'url': base + path, 'request_json': body}
              headers = {'Accept': 'application/json, audio/*', 'User-Agent': 'YouTube-Patch-Clone-Diagnostics/1.0'}
              data = None
              if body is not None:
                  headers['Content-Type'] = 'application/json'
                  data = json.dumps(body, ensure_ascii=False).encode()
              try:
                  req = urllib.request.Request(base + path, data=data, headers=headers, method=item['method'])
                  try:
                      response = urllib.request.urlopen(req, timeout=120)
                  except urllib.error.HTTPError as exc:
                      response = exc
                  with response:
                      item['status'] = response.code
                      item['content_type'] = response.headers.get('Content-Type', '')
                      content = response.read(8 * 1024 * 1024 + 1)
                      item['received_bytes'] = len(content)
                      item['size_limit_exceeded'] = len(content) > 8 * 1024 * 1024
                      if 'json' in item['content_type']:
                          parsed = json.loads(content)
                          item['response_json'] = parsed if len(content) < 8192 else {'note': 'JSON response too large to record'}
                      elif not item['content_type'].startswith('audio/'):
                          item['response_preview'] = content[:1000].decode('utf-8', 'replace')
                      else:
                          item['audio_header_hex'] = content[:16].hex()
              except Exception as exc:
                  item['error'] = str(exc)
              report['tests'].append(item)
              print(json.dumps(item, ensure_ascii=False))
          Path('docs/diagnostics/khmer-tts-direct-post.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          PYCODE
      - name: Inspect public client request format
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          from pathlib import Path
          base = 'https://takumi0002-tts-kh.hf.space'
          report = {}
          for path in ('/',):
              try:
                  with urllib.request.urlopen(base + path, timeout=60) as r:
                      report[path] = {'status': r.status, 'content': r.read(100000).decode('utf-8', 'replace')}
              except Exception as e:
                  report[path] = {'error': str(e)}
          Path('docs/diagnostics/khmer-tts-public-client.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Save diagnostic result to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/khmer-tts-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'diagnostics: record public Khmer FastAPI schema [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
