name: Inspect Khmer FastAPI TTS schema
on:
  push:
    branches: [arena/6b029760-youtube-patch-clone]
    paths: ['.github/workflows/inspect-khmer-tts.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch public FastAPI schema (no synthesis request)
        run: |
          mkdir -p docs/diagnostics
          python3 - <<'PY'
          import datetime, json, urllib.request
          from pathlib import Path
          url = 'https://takumi0002-tts-kh.hf.space/openapi.json'
          report = {'checked_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'url': url}
          try:
              request = urllib.request.Request(url, headers={'Accept':'application/json', 'User-Agent':'YouTube-Patch-Clone-Diagnostics/1.0'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  report['status'] = response.status
                  data = response.read(2 * 1024 * 1024 + 1)
                  assert len(data) <= 2 * 1024 * 1024, 'Schema size limit exceeded'
                  schema = json.loads(data)
              Path('docs/diagnostics/khmer-tts-openapi.json').write_text(json.dumps(schema, indent=2, ensure_ascii=False) + '\n')
              report['paths'] = list(schema.get('paths', {}))
          except Exception as exc:
              report['error'] = str(exc)
          Path('docs/diagnostics/khmer-tts-check.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Save diagnostic result to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/khmer-tts-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'diagnostics: record public Khmer FastAPI schema [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
