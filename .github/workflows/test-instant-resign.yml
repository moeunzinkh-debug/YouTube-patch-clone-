name: Compare Instant Translate after a disposable re-sign

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - .github/workflows/test-instant-resign.yml
      - tools/instant-translate/probe_runtime.py

permissions:
  contents: read

jobs:
  resign:
    if: contains(github.event.head_commit.message, '[instant-resign]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Re-sign only the unchanged pinned APK with a disposable key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/instant-resign"
          dir="$RUNNER_TEMP/instant-resign"
          name='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$name" --dir "$dir"
          echo 'f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  '"$dir/$name" | sha256sum --check
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          keytool -genkeypair -keystore "$dir/test.jks" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Emulator Test' >/dev/null 2>&1
          "$tools/zipalign" -f -p 4 "$dir/$name" "$dir/aligned.apk"
          "$tools/apksigner" sign --ks "$dir/test.jks" --ks-pass pass:android --key-pass pass:android \
            --out "$dir/resigned.apk" "$dir/aligned.apk"
          "$tools/apksigner" verify --min-sdk-version 29 "$dir/resigned.apk"
          # Ensure that re-signing did not change any DEX or native-library bytes.
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'instant-resign'
          original = directory / 'Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          signed = directory / 'resigned.apk'
          with zipfile.ZipFile(original) as a, zipfile.ZipFile(signed) as b:
              names = [name for name in a.namelist() if name.endswith('.dex') or name.startswith('lib/')]
              assert names and all(hashlib.sha256(a.read(name)).digest() == hashlib.sha256(b.read(name)).digest() for name in names)
          print('Original DEX and native libraries unchanged')
          PY
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Launch only the re-signed control APK in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: INSTANT_CLEAR=1 INSTANT_APK="$RUNNER_TEMP/instant-resign/resigned.apk" INSTANT_REPORT="$RUNNER_TEMP/instant-resign/control.json" INSTANT_MODE=resigned-only python3 tools/instant-translate/probe_runtime.py
      - name: Report filtered control observations
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'instant-resign' / 'control.json'
          if not path.exists():
              print('::warning::No control report was produced')
          else:
              report = json.loads(path.read_text())
              print(f"::notice::Re-signed control fatal={report.get('app_fatal_exception')} verifyIntegrity_in_stack={any('verifyIntegrity' in f for f in report.get('stack_frames', []))}")
              data = base64.b64encode(gzip.compress(path.read_bytes())).decode()
              chunks = [data[i:i+3900] for i in range(0, len(data), 3900)]
              for i, chunk in enumerate(chunks, 1):
                  print(f'::notice::INSTANT_RESIGN {i}/{len(chunks)} {chunk}')
          PY
