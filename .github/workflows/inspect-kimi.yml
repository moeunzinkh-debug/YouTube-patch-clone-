name: Inspect Kimi release asset

on:
  push:
    branches: [arena/008b2974-youtube-patch-clone]
    paths:
      - .github/workflows/inspect-kimi.yml
      - tools/kimi/inspect_apks.py
      - tools/kimi/test_inspect_apks.py

permissions:
  contents: read

concurrency:
  group: kimi-inspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[kimi-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test archive and privacy guards
        run: python3 tools/kimi/test_inspect_apks.py -v
      - name: Download exact release asset and inspect statically
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          mkdir -p "$RUNNER_TEMP/kimi-input"
          gh release download Kimi --pattern 'Kimi.v.3.1.5.b.381.minSDK26.MultiPatch.apks' --dir "$RUNNER_TEMP/kimi-input"
          echo '7000c991b9e745ccd1d1ecffaff71c2295094cb4a7fce213d3ce1d3310050304  '"$RUNNER_TEMP/kimi-input/Kimi.v.3.1.5.b.381.minSDK26.MultiPatch.apks" | sha256sum --check
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$tools_dir/apksigner"
          if ! python3 tools/kimi/inspect_apks.py \
            "$RUNNER_TEMP/kimi-input/Kimi.v.3.1.5.b.381.minSDK26.MultiPatch.apks" \
            "$RUNNER_TEMP/kimi-inventory.json" --apksigner "$tools_dir/apksigner" > "$RUNNER_TEMP/kimi-inspect.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/kimi-inspect.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/kimi-inspect.log"
      - name: Emit sanitized static inventory
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path
          data = base64.b64encode(gzip.compress((Path(os.environ['RUNNER_TEMP']) / 'kimi-inventory.json').read_bytes())).decode('ascii')
          chunks = [data[i:i+3900] for i in range(0, len(data), 3900)]
          if len(chunks) > 10:
              raise SystemExit('Sanitized inventory exceeds annotation capacity')
          for i, chunk in enumerate(chunks, 1):
              print(f'::notice::KIMI_INVENTORY {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-static-inventory
          path: ${{ runner.temp }}/kimi-inventory.json
