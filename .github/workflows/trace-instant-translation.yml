name: Trace Instant Translate failure paths

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - .github/workflows/trace-instant-translation.yml
      - tools/instant-translate/trace_translation.py
      - tools/instant-translate/test_trace_translation.py

permissions:
  contents: read

concurrency:
  group: trace-instant-translation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trace:
    if: contains(github.event.head_commit.message, '[instant-trace]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test privacy guards and anchor logic
        run: |
          python3 tools/instant-translate/test_inspect_apk.py -v
          python3 tools/instant-translate/test_trace_translation.py -v
      - name: Trace translation failure anchors in the pinned APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          mkdir -p "$RUNNER_TEMP/instant-input"
          filename='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$filename" --dir "$RUNNER_TEMP/instant-input"
          echo "f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  $RUNNER_TEMP/instant-input/$filename" | sha256sum --check
          if ! python3 tools/instant-translate/trace_translation.py "$RUNNER_TEMP/instant-input/$filename" \
            "$RUNNER_TEMP/instant-trace.json" > "$RUNNER_TEMP/instant-trace.log" 2>&1; then
            tail -n 15 "$RUNNER_TEMP/instant-trace.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/instant-trace.log"
      - name: Report sanitized code anchors
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path
          raw = (Path(os.environ['RUNNER_TEMP']) / 'instant-trace.json').read_bytes()
          data = base64.b64encode(gzip.compress(raw)).decode('ascii')
          chunks = [data[i:i + 3900] for i in range(0, len(data), 3900)]
          if len(chunks) > 20:
              raise SystemExit('Sanitized trace exceeds annotation capacity')
          for i, chunk in enumerate(chunks, 1):
              print(f'::notice::INSTANT_TRACE {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: instant-translate-failure-trace
          path: ${{ runner.temp }}/instant-trace.json
