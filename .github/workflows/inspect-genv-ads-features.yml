name: Inspect GenV ads and non-entitlement feature gates

on:
  push:
    branches: [arena/56af8e2c-youtube-patch-clone]
    paths:
      - tools/genv/inspect_ads_features.py
      - .github/workflows/inspect-genv-ads-features.yml

permissions:
  contents: write

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[genv-ad-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and inspect the pinned base without executing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/genv-inspect"
          gh release download GenV --pattern GenV_3.7.2.apk --dir "$RUNNER_TEMP/genv-inspect"
          echo 'f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e  '"$RUNNER_TEMP/genv-inspect/GenV_3.7.2.apk" | sha256sum --check
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          python3 tools/genv/inspect_ads_features.py "$RUNNER_TEMP/genv-inspect/GenV_3.7.2.apk" \
            bundles/genv/ad-feature-inspection.json
      - name: Save only the sanitized static report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bundles/genv/ad-feature-inspection.json
          git commit -m 'Record GenV ad and feature-gate inspection [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
