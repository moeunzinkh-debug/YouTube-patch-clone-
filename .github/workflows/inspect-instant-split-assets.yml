name: Inspect newly supplied Instant Translate splits

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - '.github/workflows/inspect-instant-split-assets.yml'
      - 'tools/instant-translate/inspect_split_assets.py'

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[instant-splits]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download new split assets and inspect static metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          dir="$RUNNER_TEMP/instant-splits"
          mkdir -p "$dir"
          gh release download Instant-translate --pattern 'base.apk' --pattern 'split_config.arm64_v8a.apk' \
            --pattern 'split_config.en.apk' --pattern 'split_config.km.apk' --pattern 'split_config.xxhdpi.apk' --dir "$dir"
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          python3 tools/instant-translate/inspect_split_assets.py "$dir" "$RUNNER_TEMP/instant-splits-report.json" --apksigner "$tools/apksigner"
      - name: Report safe split metadata
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'], 'instant-splits-report.json')
          if not p.exists():
              print('::warning::No static split report')
          else:
              data = base64.b64encode(gzip.compress(p.read_bytes())).decode()
              chunks = [data[i:i+3900] for i in range(0, len(data), 3900)]
              for i, chunk in enumerate(chunks, 1): print(f'::notice::INSTANT_SPLITS {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-split-static-inventory
          path: ${{ runner.temp }}/instant-splits-report.json
          if-no-files-found: ignore
