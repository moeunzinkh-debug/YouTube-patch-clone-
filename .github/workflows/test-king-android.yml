name: King-Patcher synthetic Android integration smoke

on:
  push:
    branches: [arena/dc6d652d-youtube-patch-clone]
    paths:
      - 'tools/king-patcher/tests/android/**'
      - '.github/workflows/test-king-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  android:
    if: contains(github.event.head_commit.message, '[king-android]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain a matching successful static-test bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/king-android" "$RUNNER_TEMP/king-bundle"
          gh run list --workflow build-king-patcher.yml --branch "$GITHUB_REF_NAME" --limit 30 \
            --json databaseId,status,conclusion,headSha > "$RUNNER_TEMP/king-android/build-runs.json"
          run_id="$(python3 - "$RUNNER_TEMP/king-android/build-runs.json" <<'PY'
          import json, subprocess, sys
          rows=json.load(open(sys.argv[1]))
          paths=['tools/king-patcher/project','tools/king-patcher/prepare_build.py','tools/king-patcher/verify_bundle.py']
          def tree(revision,path):
              return subprocess.check_output(['git','rev-parse',revision+':'+path],text=True).strip()
          for row in rows:
              if row['status'] != 'completed' or row['conclusion'] != 'success': continue
              try:
                  if all(tree(row['headSha'],p)==tree('HEAD',p) for p in paths):
                      print(row['databaseId']);break
              except subprocess.CalledProcessError: pass
          else: raise SystemExit('No successful static build matches the current bundle source')
          PY
          )"
          gh run download "$run_id" --name king-patcher-bundle-static-only --dir "$RUNNER_TEMP/king-bundle"
          (cd "$RUNNER_TEMP/king-bundle" && sha256sum --check bundle.mpp.sha256)
          python3 tools/king-patcher/verify_bundle.py --mpp "$RUNNER_TEMP/king-bundle/bundle.mpp" \
            --listing "$RUNNER_TEMP/king-bundle/patches.txt"
          echo "::notice::Using source-matched, statically verified bundle from run $run_id"
      - name: Build synthetic fixtures and patch disposable King copy
        shell: bash
        run: |
          set -euo pipefail
          if ! bash tools/king-patcher/tests/android/prepare_fixture.sh "$RUNNER_TEMP/king-android" \
              "$RUNNER_TEMP/king-bundle/bundle.mpp" > "$RUNNER_TEMP/king-android/prepare.log" 2>&1; then
            python3 - "$RUNNER_TEMP/king-android/prepare.log" "$RUNNER_TEMP/king-android/patch.log" <<'PY'
          import base64,gzip,pathlib,sys
          text='\n'.join('\n'.join(p.read_text(errors='replace').splitlines()[-80:]) for p in map(pathlib.Path,sys.argv[1:]) if p.exists())
          print('::error::KING_ANDROID_SETUP '+base64.b64encode(gzip.compress(text.encode())).decode()[:30000])
          PY
            exit 1
          fi
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM is unavailable'; fi
      - name: Exercise manual UI, automatic LVL and PairIP detection, signing and install on Android 15
        id: emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/king-patcher/tests/android/emulator_smoke.py "$RUNNER_TEMP/king-android" "$RUNNER_TEMP/king-android/report.json"
      - name: Report sanitized outcome
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/king-android/report.json"; then
            python3 - "$RUNNER_TEMP/king-android/report.json" <<'PY'
          import base64,gzip,pathlib,sys
          data=pathlib.Path(sys.argv[1]).read_bytes()
          print('::notice::KING_ANDROID_REPORT '+base64.b64encode(gzip.compress(data)).decode()[:30000])
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: king-patcher-android-report
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/king-android/report.json
            ${{ runner.temp }}/king-android/patch-result.json
            ${{ runner.temp }}/king-android/instrument.log
