name: Inspect original Instant Translate settings

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - .github/workflows/inspect-instant-settings.yml
      - tools/instant-translate/probe_settings.py
      - tools/instant-translate/trace_settings.py

permissions:
  contents: read

jobs:
  static:
    if: contains(github.event.head_commit.message, '[instant-settings]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect pinned APK settings without executing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          mkdir -p "$RUNNER_TEMP/instant-settings"
          name='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$name" --dir "$RUNNER_TEMP/instant-settings"
          input="$RUNNER_TEMP/instant-settings/$name"
          echo 'f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  '"$input" | sha256sum --check
          if ! python3 tools/instant-translate/trace_settings.py "$input" "$RUNNER_TEMP/instant-settings/trace.json" > "$RUNNER_TEMP/instant-settings/trace.log" 2>&1; then
            tail -n 15 "$RUNNER_TEMP/instant-settings/trace.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Report sanitized settings anchors
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          data = base64.b64encode(gzip.compress((Path(os.environ['RUNNER_TEMP']) / 'instant-settings/trace.json').read_bytes())).decode()
          chunks = [data[i:i+3900] for i in range(0,len(data),3900)]
          if len(chunks) > 50: raise SystemExit('Sanitized trace too large for annotations')
          for i, chunk in enumerate(chunks, 1): print(f'::notice::INSTANT_SETTINGS_TRACE {i}/{len(chunks)} {chunk}')
          PY
  runtime:
    if: contains(github.event.head_commit.message, '[instant-settings]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Download pinned original APK only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/instant-settings"
          name='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$name" --dir "$RUNNER_TEMP/instant-settings"
          echo 'f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  '"$RUNNER_TEMP/instant-settings/$name" | sha256sum --check
          mv "$RUNNER_TEMP/instant-settings/$name" "$RUNNER_TEMP/instant-settings/input.apk"
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Inspect Settings on the original APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/instant-translate/probe_settings.py
      - name: Report sanitized Settings hierarchy and screen previews
        if: always()
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          import base64, gzip, io, os
          from pathlib import Path
          from PIL import Image
          directory = Path(os.environ['RUNNER_TEMP']) / 'instant-settings'
          report = directory / 'settings-runtime.json'
          if report.exists():
              encoded = base64.b64encode(gzip.compress(report.read_bytes())).decode()
              chunks = [encoded[i:i+3900] for i in range(0,len(encoded),3900)]
              for i, chunk in enumerate(chunks, 1): print(f'::notice::INSTANT_SETTINGS_RUNTIME {i}/{len(chunks)} {chunk}')
          for name in ('top','middle','bottom'):
              file = directory / f'settings-{name}.png'
              if not file.exists(): continue
              image = Image.open(file).convert('RGB'); image.thumbnail((320,640))
              out=io.BytesIO(); image.save(out, format='JPEG', quality=25, optimize=True)
              encoded = base64.b64encode(out.getvalue()).decode()
              chunks = [encoded[i:i+3900] for i in range(0,len(encoded),3900)]
              if len(chunks) > 9: continue
              for i, chunk in enumerate(chunks, 1): print(f'::notice::INSTANT_SETTINGS_SCREEN_{name.upper()} {i}/{len(chunks)} {chunk}')
          PY
