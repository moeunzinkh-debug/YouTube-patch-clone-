name: Build Telegram email alternative experiment
on:
  push:
    branches: [arena/cbe2e9a9-youtube-patch-clone]
    paths:
      - 'extras/telegram-email-experiment/**'
      - 'extras/telegram-upstream/**'
      - 'tools/telegram-email/**'
      - 'tools/telegram/**'
      - '.github/workflows/build-telegram-email-experiment.yml'
permissions:
  contents: write
  packages: read
concurrency:
  group: telegram-email-experiment-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-test:
    if: contains(github.event.head_commit.message, '[telegram-email-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify upstream and run synthetic offline tests
        run: |
          set -euo pipefail
          python3 tools/telegram/test_telegram_subset.py
          python3 tools/telegram-email/test_experiment.py -v
          bash tools/telegram-email/test_bridge.sh
          (cd bundles/telegram && sha256sum --check bundle.mpp.sha256)
          python3 tools/telegram-email/prepare_build.py /tmp/telegram-email-build
      - name: Build the separate experimental Morphe bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          cd /tmp/telegram-email-build
          ./gradlew :patches:buildAndroid --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/telegram-email-build.log
      - name: Report build errors
        if: failure()
        run: |
          if test -f /tmp/telegram-email-build.log; then
            grep -E -A 5 '^e:|^error:|What went wrong|Execution failed|Could not|FAILURE:|Exception' /tmp/telegram-email-build.log | tail -45 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - name: Verify archive and actual Morphe Desktop catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/telegram-email-output
          mapfile -t bundles < <(find /tmp/telegram-email-build/patches/build/libs -maxdepth 1 -name '*.mpp' -type f)
          test "${#bundles[@]}" -eq 1
          cp "${bundles[0]}" /tmp/telegram-email-output/bundle.mpp
          (cd /tmp/telegram-email-output && sha256sum bundle.mpp > bundle.mpp.sha256)
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop \
            --pattern morphe-desktop-1.19.1-all.jar --dir /tmp/telegram-email-output
          echo 'a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  /tmp/telegram-email-output/morphe-desktop-1.19.1-all.jar' | sha256sum --check
          java -Xmx2g -jar /tmp/telegram-email-output/morphe-desktop-1.19.1-all.jar list-patches \
            --patches /tmp/telegram-email-output/bundle.mpp --with-packages --with-versions --include-experimental \
            --out /tmp/telegram-email-output/patches.txt
          if ! python3 tools/telegram-email/verify_bundle.py --mpp /tmp/telegram-email-output/bundle.mpp \
            --listing /tmp/telegram-email-output/patches.txt >/tmp/telegram-email-catalog.log 2>&1; then
            tail -n 20 /tmp/telegram-email-catalog.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat /tmp/telegram-email-catalog.log
      - name: Verify exact signed Telegram Web APK and apply the actual patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Telegram experiment APK step failed at line $LINENO (exit $status)"; for log in /tmp/telegram-email-single.log /tmp/telegram-email-all.log; do if test -f "$log"; then grep -Ei "error|failed|exception|missing|unable" "$log" | tail -6 | while IFS= read -r line; do echo "::error::$line"; done || true; fi; done' ERR
          out=/tmp/telegram-email-output
          gh release download android-12.10.1 --repo LOVECHEN/telegram-release \
            --pattern Telegram-12.10.1.apk --dir "$out"
          input="$out/Telegram-12.10.1.apk"
          echo "f5e1192725772960cc94b83e54ffd8939f876b2b6e5f21d4a8537eb6fcba50e6  $input" | sha256sum --check
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)
          "$tools/apksigner" verify --verbose --print-certs "$input" > "$out/signer.txt"
          grep -Fq 'Number of signers: 1' "$out/signer.txt"
          grep -Fiq 'certificate SHA-256 digest: 49c1522548ebacd46ce322b6fd47f6092bb745d0f88082145caf35e14dcc38e1' "$out/signer.txt"
          "$tools/aapt" dump badging "$input" > "$out/badging.txt"
          grep -Fq "name='org.telegram.messenger.web' versionCode='70389' versionName='12.10.1'" "$out/badging.txt"
          desktop="$out/morphe-desktop-1.19.1-all.jar"
          selector='Try another login method (experimental)'
          java -Xmx4g -jar "$desktop" patch "$input" -p "$out/bundle.mpp" --exclusive -e "$selector" \
            --unsigned -o "$out/experiment-only-unsigned.apk" -r "$out/experiment-only.json" > /tmp/telegram-email-single.log 2>&1
          java -Xmx4g -jar "$desktop" patch "$input" -p "$out/bundle.mpp" -e "$selector" \
            --unsigned -o "$out/default-plus-experiment-unsigned.apk" -r "$out/default-plus-experiment.json" > /tmp/telegram-email-all.log 2>&1
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools/telegram')
          from verify_patching import verify_report
          from verify_bundle import NAMES
          output = Path('/tmp/telegram-email-output')
          selector = 'Try another login method (experimental)'
          verify_report(output / 'experiment-only.json', {selector}, 'org.telegram.messenger.web')
          verify_report(output / 'default-plus-experiment.json', (NAMES - {'Disable analytics'}) | {selector}, 'org.telegram.messenger.web')
          print('Morphe applied the experiment both alone and together with all 14 compatible defaults')
          PY
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          python3 tools/telegram-email/verify_apk.py "$input" "$out/experiment-only-unsigned.apk" \
            "$out/default-plus-experiment-unsigned.apk" "$out/dex-report.json" > /tmp/telegram-email-dex.log 2>&1 || {
              tail -n 12 /tmp/telegram-email-dex.log | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          cat /tmp/telegram-email-dex.log
      - name: Make disposable test-signed fixtures for emulator only
        run: |
          set -euo pipefail
          out=/tmp/telegram-email-output
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)
          android_jar=$(find "$ANDROID_HOME/platforms" -name android.jar -type f | sort -V | tail -1)
          test -n "$android_jar"
          keytool -genkeypair -noprompt -keystore "$out/test.keystore" -storepass android -keypass android \
            -alias test -dname 'CN=Telegram email experiment test only' -keyalg RSA -keysize 2048 -validity 2 > /dev/null 2>&1
          "$tools/zipalign" -p -f 4 "$out/experiment-only-unsigned.apk" "$out/experiment-only-aligned.apk"
          "$tools/apksigner" sign --ks "$out/test.keystore" --ks-pass pass:android --key-pass pass:android \
            --out "$out/experiment-test.apk" "$out/experiment-only-aligned.apk"
          "$tools/apksigner" verify "$out/experiment-test.apk"
          mkdir -p "$out/harness-classes" "$out/harness-dex"
          javac -encoding UTF-8 -source 8 -target 8 -cp "$android_jar" -d "$out/harness-classes" \
            tools/telegram-email/android-test/src/app/morphe/telegramemailtest/SyntheticEmailHarness.java
          mapfile -t classes < <(find "$out/harness-classes" -name '*.class' -type f)
          test "${#classes[@]}" -gt 0
          "$tools/d8" --min-api 26 --lib "$android_jar" --output "$out/harness-dex" "${classes[@]}"
          "$tools/aapt" package -f -M tools/telegram-email/android-test/AndroidManifest.xml \
            -I "$android_jar" -F "$out/harness-unsigned.apk"
          (cd "$out/harness-dex" && zip -q "$out/harness-unsigned.apk" classes.dex)
          "$tools/zipalign" -p -f 4 "$out/harness-unsigned.apk" "$out/harness-aligned.apk"
          "$tools/apksigner" sign --ks "$out/test.keystore" --ks-pass pass:android --key-pass pass:android \
            --out "$out/harness-test.apk" "$out/harness-aligned.apk"
          "$tools/apksigner" verify "$out/harness-test.apk"
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
          else
            echo '::warning::KVM unavailable; Android emulator may not start.'
          fi
      - name: Exercise the real Add Email view with synthetic data
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/telegram-email/emulator_test.py /tmp/telegram-email-output/experiment-test.apk /tmp/telegram-email-output/harness-test.apk /tmp/telegram-email-output/android-smoke.json
      - name: Publish only verified experimental bundle and sanitized reports
        run: |
          set -euo pipefail
          if [ '${{ steps.emulator.outcome }}' != success ]; then
            echo '::error::Synthetic Android test did not pass; refusing to publish the experimental MPP.'
            exit 1
          fi
          out=/tmp/telegram-email-output
          python3 tools/telegram-email/write_validation.py "$out/bundle.mpp" "$out/dex-report.json" \
            "$out/android-smoke.json" "$out/validation.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          for path in extras/telegram-upstream extras/telegram-email-experiment tools/telegram tools/telegram-email .github/workflows/build-telegram-email-experiment.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$path")" != "$(git rev-parse "HEAD:$path")" ]; then
              echo 'Experiment inputs changed during the run; refusing an outdated publication.'
              exit 1
            fi
          done
          test "$GITHUB_REF_NAME" = 'arena/cbe2e9a9-youtube-patch-clone'
          mkdir -p bundles/telegram-email-experimental
          cp "$out/bundle.mpp" "$out/bundle.mpp.sha256" "$out/validation.json" "$out/android-smoke.json" bundles/telegram-email-experimental/
          git add -f bundles/telegram-email-experimental/bundle.mpp bundles/telegram-email-experimental/bundle.mpp.sha256 \
            bundles/telegram-email-experimental/validation.json bundles/telegram-email-experimental/android-smoke.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: experimental Telegram email alternative [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
