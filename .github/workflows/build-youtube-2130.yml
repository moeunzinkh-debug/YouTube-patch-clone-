name: Build YouTube 21.30.216 patch update

on:
  push:
    branches: [arena/c4f8fd6a-youtube-patch-clone]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'tools/tests/**'
      - 'tools/equalizer-tests/**'
      - 'tools/khmer-tts-tests/**'
      - 'tools/verify_youtube_update.py'
      - '.github/workflows/build-youtube-2130.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: youtube-target-2130-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: contains(github.event.head_commit.message, '[youtube-2130-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test selector scope and custom integrations
        run: |
          python3 -m unittest discover -s tools/tests -v
          bash tools/equalizer-tests/run.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq libandroid-json-java
          bash tools/khmer-tts-tests/run.sh
      - name: Download pinned Morphe Desktop for catalog verification
        run: |
          mkdir -p "$RUNNER_TEMP/youtube-tools"
          gh release download v1.20.0-dev.1 --repo MorpheApp/morphe-desktop \
            --pattern morphe-desktop-1.20.0-dev.1-all.jar --dir "$RUNNER_TEMP/youtube-tools"
          echo '20c2cf951373f4e47092a7c9312519ecfd4b2826ddc114b134e0ad503af53fdb  '"$RUNNER_TEMP/youtube-tools/morphe-desktop-1.20.0-dev.1-all.jar" | sha256sum -c
      # generatePatchesList is a JVM task that can recreate the jar. Android
      # packaging must be the final Gradle task so its DEX files remain included.
      - name: Build generated catalog and Android patch bundle
        run: |
          set -o pipefail
          ./gradlew :extensions:youtube:testDebugUnitTest :patches:generatePatchesList :patches:buildAndroid --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$RUNNER_TEMP/youtube-build.log"
      - name: Report build diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/youtube-build.log"; then
            grep -E -A 4 '^e:|^error:|What went wrong|Execution failed|Could not|FAILED|FAILURE:' "$RUNNER_TEMP/youtube-build.log" | tail -60 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - name: Verify MPP and Morphe Desktop listings
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.mpp')
          test "${#bundles[@]}" -eq 1
          cp "${bundles[0]}" patch.mpp
          sha256sum patch.mpp > patch.mpp.sha256
          python3 .github/scripts/verify-mpp.py
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('extensions/youtube/build/test-results/testDebugUnitTest/*.xml')
          suites = [ET.parse(path).getroot() for path in files]
          count = sum(int(s.attrib.get('tests', 0)) for s in suites)
          failures = sum(int(s.attrib.get('failures', 0)) + int(s.attrib.get('errors', 0)) for s in suites)
          assert count > 0 and failures == 0, (count, failures)
          print(f'::notice::{count} upstream YouTube JVM tests passed (no APK in this build job).')
          PY
          desktop="$RUNNER_TEMP/youtube-tools/morphe-desktop-1.20.0-dev.1-all.jar"
          java -Xmx2g -jar "$desktop" list-patches --patches patch.mpp \
            --with-packages --with-versions --out "$RUNNER_TEMP/youtube-default-list.txt"
          java -Xmx2g -jar "$desktop" list-patches --patches patch.mpp \
            --with-packages --with-versions --include-experimental --out "$RUNNER_TEMP/youtube-all-list.txt"
          python3 tools/verify_youtube_update.py --manifest patches-list.json --mpp patch.mpp \
            --listing "$RUNNER_TEMP/youtube-default-list.txt" \
            --experimental-listing "$RUNNER_TEMP/youtube-all-list.txt"
          mkdir -p "$RUNNER_TEMP/youtube-output"
          cp patch.mpp patch.mpp.sha256 patches-list.json "$RUNNER_TEMP/youtube-output/"
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-2130-patch-bundle
          path: |
            ${{ runner.temp }}/youtube-output/patch.mpp
            ${{ runner.temp }}/youtube-output/patch.mpp.sha256
            ${{ runner.temp }}/youtube-output/patches-list.json
            ${{ runner.temp }}/youtube-default-list.txt
            ${{ runner.temp }}/youtube-all-list.txt
            extensions/youtube/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
      # Publish the verified build only to the session branch, never a release.
      # Refuse to save a stale binary if relevant sources changed while building.
      - name: Save verified bundle to this branch
        run: |
          set -euo pipefail
          git restore patch.mpp patch.mpp.sha256 patches-list.json
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          for source in patches extensions gradle gradle.properties settings.gradle.kts tools/verify_youtube_update.py tools/tests .github/workflows/build-youtube-2130.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$source")" != "$(git rev-parse "HEAD:$source")" ]; then
              echo '::error::Sources changed while building; refusing to save a stale bundle.'
              exit 1
            fi
          done
          cp "$RUNNER_TEMP/youtube-output/"{patch.mpp,patch.mpp.sha256,patches-list.json} .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f patch.mpp patch.mpp.sha256 patches-list.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: YouTube 21.30.216 patch bundle [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
