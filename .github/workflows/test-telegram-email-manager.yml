name: Test Telegram email experiment in Morphe Manager
on:
  push:
    branches: [arena/cbe2e9a9-youtube-patch-clone]
    paths:
      - 'tools/telegram-email-manager/**'
      - '.github/workflows/test-telegram-email-manager.yml'
permissions:
  contents: read
jobs:
  manager-smoke:
    if: contains(github.event.head_commit.message, '[telegram-email-manager]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Download and verify test inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/telegram-email-manager
          gh release download v2.2.0 --repo MorpheApp/morphe-manager --pattern morphe-manager-2.2.0.apk --dir /tmp/telegram-email-manager
          gh release download android-12.10.1 --repo LOVECHEN/telegram-release --pattern Telegram-12.10.1.apk --dir /tmp/telegram-email-manager
          echo '5a175a77f671088c97ebaa6fdd65b1d4ed9f07dda44d59a37d3d11a712da2c44  /tmp/telegram-email-manager/morphe-manager-2.2.0.apk' | sha256sum --check
          echo 'f5e1192725772960cc94b83e54ffd8939f876b2b6e5f21d4a8537eb6fcba50e6  /tmp/telegram-email-manager/Telegram-12.10.1.apk' | sha256sum --check
          (cd bundles/telegram-email-experimental && sha256sum --check bundle.mpp.sha256)
          echo 'f5dc6a460e3e0d4c092c3b232f086e03e76db688294e78196ed3744f15284788  bundles/telegram-email-experimental/bundle.mpp' | sha256sum --check
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Test local source and patching in Morphe Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/telegram-email-manager/test_manager.py
