name: Investigate Gboard Translate

on:
  workflow_dispatch:
  push:
    branches: [arena/69154a0c-youtube-patch-clone]
    paths:
      - 'tools/gboard/investigate_translate.py'
      - 'tools/gboard/probe_google_translate.py'
      - 'tools/gboard/test_translate_investigation.py'
      - 'tools/gboard/trace_translate_methods.py'
      - '.github/workflows/investigate-gboard-translate.yml'

permissions:
  contents: write

concurrency:
  group: gboard-translate-investigation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gboard-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic tooling
        run: python -m pip install --disable-pip-version-check 'androguard==4.1.3' 'goopdl==1.2.2'
      - name: Test the diagnostic tools without network access
        run: python tools/gboard/test_translate_investigation.py -v
      - name: Probe Google with synthetic English and Khmer phrases
        run: |
          mkdir -p /tmp/gboard-report
          python tools/gboard/probe_google_translate.py /tmp/gboard-report/google-translate-probe.json
          python - <<'PY'
          import json
          for case in json.load(open('/tmp/gboard-report/google-translate-probe.json'))['results']:
              print(f"::notice::Synthetic {case['source']} to {case['target']} via {case['method']}: {case['status']}, HTTP {case.get('http_status', 'unavailable')}")
          PY
      - name: Acquire an exact-version APK for static inspection only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gboard-play /tmp/gboard-mirror /tmp/gboard-third-party
          # No personal Google account, typed keyboard text, or user credentials.
          # The anonymous dispenser's raw output is intentionally not published.
          if timeout 240s python -m goopdl download com.google.android.inputmethod.latin \
               --version 176049702 --arch arm64 --splits --no-extras \
               --output /tmp/gboard-play > /tmp/gboard-play-download.log 2>&1 \
             && test -s /tmp/gboard-play/com.google.android.inputmethod.latin-176049702.apk; then
            echo 'source=google-play' >> "$GITHUB_ENV"
            echo 'apk=/tmp/gboard-play/com.google.android.inputmethod.latin-176049702.apk' >> "$GITHUB_ENV"
            echo 'Exact Google Play build downloaded; signature will be independently verified.'
          elif curl --fail --location --silent --show-error --max-time 90 \
                'https://d.apkpure.com/b/APK/com.google.android.inputmethod.latin?versionCode=176049702' \
                --output /tmp/gboard-mirror/gboard.apk \
                && unzip -tq /tmp/gboard-mirror/gboard.apk > /dev/null 2>&1; then
            # A mirror is not Google Play. Verify Google's signing certificate
            # and the exact manifest separately before using it.
            echo 'source=google-signed-mirror' >> "$GITHUB_ENV"
            echo 'apk=/tmp/gboard-mirror/gboard.apk' >> "$GITHUB_ENV"
            echo 'Downloaded from a public mirror; Google signature and version still require verification.'
          else
            echo 'Stock download unavailable; use a pinned third-party patched build for static investigation only.'
            gh release download 'gboard-v18.5.4.993608717-release-arm64-v8a-p4.0.0' \
              --repo iamwaqargulzar/auto-morphe-apk-builds \
              --pattern 'gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk' \
              --dir /tmp/gboard-third-party
            echo '1d9260f74430265bcf4087ae45d6a22f688d907fd5ed84998ea15d4eac4e93ea  /tmp/gboard-third-party/gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk' | sha256sum --check
            echo 'source=third-party-prepatched' >> "$GITHUB_ENV"
            echo 'apk=/tmp/gboard-third-party/gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk' >> "$GITHUB_ENV"
          fi
      - name: Verify APK signature and inventory native Translate references
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::APK inspection failed at shell line $LINENO (exit $status)."' ERR
          echo "::notice::APK source: $source"
          signer_tool="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer_tool" || { echo '::error::Android apksigner not found.'; exit 1; }
          if ! "$signer_tool" verify --print-certs "$apk" > /tmp/gboard-signature.txt 2>&1; then
            echo "::error::APK signature verification failed: $(tail -1 /tmp/gboard-signature.txt)"
            exit 1
          fi
          # Android build-tools 37 prints 'V2 Signer:' / 'V3.0 Signer:';
          # older releases print 'Signer #1'. Accept both, de-duplicate schemes.
          signers="$(sed -nE 's/^.*certificate SHA-256 digest: ([[:xdigit:]]{64})$/\1/p' /tmp/gboard-signature.txt | tr '[:upper:]' '[:lower:]' | sort -u)"
          test -n "$signers" || { echo '::error::Could not read the APK signing certificate digest.'; exit 1; }
          if [ "$source" != third-party-prepatched ]; then
            signer=f0fd6c5b410f25cb25c3b53346c8972fae30f8ee7411df910480ad6b2d60db83
            grep -Fxq "$signer" <<< "$signers" || { echo '::error::Downloaded APK is not signed by the expected Google certificate.'; exit 1; }
          else
            signer="$(head -1 <<< "$signers")"
          fi
          echo "::notice::APK signing certificate SHA-256: $signer"
          if ! python tools/gboard/investigate_translate.py "$apk" /tmp/gboard-report/translate-inventory.json \
            --source "$source" --signer-sha256 "$signer" > /tmp/gboard-inventory.log 2>&1; then
            echo "::error::DEX inventory failed: $(tail -1 /tmp/gboard-inventory.log)"
            exit 1
          fi
          cat /tmp/gboard-inventory.log
      - name: Trace selected request and callback methods with literals redacted
        run: python tools/gboard/trace_translate_methods.py "$apk"
      - name: Publish only sanitized diagnostic reports to this session branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/69154a0c-youtube-patch-clone'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          for path in tools/gboard/investigate_translate.py tools/gboard/probe_google_translate.py tools/gboard/test_translate_investigation.py tools/gboard/trace_translate_methods.py .github/workflows/investigate-gboard-translate.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$path")" != "$(git rev-parse "HEAD:$path")" ]; then
              echo 'Diagnostic inputs changed; not publishing stale reports.'
              exit 0
            fi
          done
          mkdir -p docs/gboard
          cp /tmp/gboard-report/google-translate-probe.json docs/gboard/
          cp /tmp/gboard-report/translate-inventory.json docs/gboard/
          git add docs/gboard/google-translate-probe.json docs/gboard/translate-inventory.json
          git diff --cached --quiet && exit 0
          git commit -m 'diagnostics: record Gboard Translate investigation [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
