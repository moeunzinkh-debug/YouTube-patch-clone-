name: Build experimental Instant Translate Morphe patch

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - 'tools/instant-translate/project/**'
      - 'tools/instant-translate/prepare_build.py'
      - 'tools/instant-translate/verify_bundle.py'
      - 'tools/instant-translate/verify_patched.py'
      - '.github/workflows/build-instant-translate-mpp.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: instant-translate-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: contains(github.event.head_commit.message, '[instant-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated project and pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/instant-translate/test_inspect_apk.py -v
          python3 tools/instant-translate/test_trace_translation.py -v
          python3 tools/instant-translate/prepare_build.py "$RUNNER_TEMP/instant-build"
          mkdir -p "$RUNNER_TEMP/instant-input" "$RUNNER_TEMP/instant-output"
          name='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$name" --dir "$RUNNER_TEMP/instant-input"
          gh release download v1.20.0-dev.1 --repo MorpheApp/morphe-desktop --pattern morphe-desktop-1.20.0-dev.1-all.jar --dir "$RUNNER_TEMP/instant-input"
          echo 'f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  '"$RUNNER_TEMP/instant-input/$name" | sha256sum --check
          echo '20c2cf951373f4e47092a7c9312519ecfd4b2826ddc114b134e0ad503af53fdb  '"$RUNNER_TEMP/instant-input/morphe-desktop-1.20.0-dev.1-all.jar" | sha256sum --check
      - name: Test transport, async fallback and build MPP
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/instant-build"
          ./gradlew :extensions:instanttranslate:testDebugUnitTest :patches:buildAndroid --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$RUNNER_TEMP/instant-build.log"
      - name: Report build diagnostics
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/instant-build.log"; then
            grep -E -A 5 '^e:|^error:|What went wrong|Execution failed|Could not|FAILED|FAILURE:' "$RUNNER_TEMP/instant-build.log" | tail -45 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - name: Verify listing and apply the MPP to the pinned APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find "$RUNNER_TEMP/instant-build/patches/build/libs" -maxdepth 1 -name '*.mpp' -type f)
          test "${#candidates[@]}" -eq 1
          cp "${candidates[0]}" "$RUNNER_TEMP/instant-output/bundle.mpp"
          (cd "$RUNNER_TEMP/instant-output" && sha256sum bundle.mpp > bundle.mpp.sha256)
          desktop="$RUNNER_TEMP/instant-input/morphe-desktop-1.20.0-dev.1-all.jar"
          input="$RUNNER_TEMP/instant-input/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk"
          java -Xmx2g -jar "$desktop" list-patches --patches "$RUNNER_TEMP/instant-output/bundle.mpp" \
            --with-packages --with-versions --include-experimental --out "$RUNNER_TEMP/instant-output/patches.txt"
          if ! python3 tools/instant-translate/verify_bundle.py --mpp "$RUNNER_TEMP/instant-output/bundle.mpp" \
            --listing "$RUNNER_TEMP/instant-output/patches.txt" > "$RUNNER_TEMP/instant-list-check.log" 2>&1; then
            tail -n 15 "$RUNNER_TEMP/instant-list-check.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if ! java -Xmx4g -jar "$desktop" patch "$input" -p "$RUNNER_TEMP/instant-output/bundle.mpp" \
            --exclusive -e 'Translation fallback (Google, experimental)' --unsigned \
            -o "$RUNNER_TEMP/instant-input/patched.apk" -r "$RUNNER_TEMP/instant-input/patch-result.json" > "$RUNNER_TEMP/instant-patch.log" 2>&1; then
            tail -n 30 "$RUNNER_TEMP/instant-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          if ! python3 tools/instant-translate/verify_patched.py "$input" "$RUNNER_TEMP/instant-input/patched.apk" \
            "$RUNNER_TEMP/instant-input/patch-result.json" "$RUNNER_TEMP/instant-output/fallback-validation.json" > "$RUNNER_TEMP/instant-dex-check.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/instant-dex-check.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if ! java -Xmx4g -jar "$desktop" patch "$input" -p "$RUNNER_TEMP/instant-output/bundle.mpp" \
            --exclusive -e 'Translation fallback (Google, experimental)' -e 'Settings Patch (SEA-LION, experimental)' --unsigned \
            -o "$RUNNER_TEMP/instant-input/settings-patched.apk" -r "$RUNNER_TEMP/instant-input/settings-result.json" > "$RUNNER_TEMP/instant-settings-patch.log" 2>&1; then
            tail -n 30 "$RUNNER_TEMP/instant-settings-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if ! python3 tools/instant-translate/verify_patched.py --settings "$input" "$RUNNER_TEMP/instant-input/settings-patched.apk" \
            "$RUNNER_TEMP/instant-input/settings-result.json" "$RUNNER_TEMP/instant-output/patch-validation.json" > "$RUNNER_TEMP/instant-settings-check.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/instant-settings-check.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo '::notice::Both opt-in Instant Translate patches listed and applied; DEX and preserved integrity check verified. Device runtime is not implied.'
      - uses: actions/upload-artifact@v4
        with:
          name: instant-translate-experimental-mpp
          path: |
            ${{ runner.temp }}/instant-output/bundle.mpp
            ${{ runner.temp }}/instant-output/bundle.mpp.sha256
            ${{ runner.temp }}/instant-output/patch-validation.json
            ${{ runner.temp }}/instant-output/patches.txt
            ${{ runner.temp }}/instant-build/extensions/instanttranslate/build/test-results/testDebugUnitTest/*.xml
      - name: Save only the small standalone bundle and static report
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          for source in tools/instant-translate/project tools/instant-translate/prepare_build.py tools/instant-translate/verify_bundle.py tools/instant-translate/verify_patched.py .github/workflows/build-instant-translate-mpp.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$source")" != "$(git rev-parse "HEAD:$source")" ]; then
              echo '::warning::Instant Translate build sources changed; not saving stale results.'
              exit 0
            fi
          done
          mkdir -p bundles/instant-translate
          cp "$RUNNER_TEMP/instant-output/"{bundle.mpp,bundle.mpp.sha256,patch-validation.json} bundles/instant-translate/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f bundles/instant-translate/bundle.mpp bundles/instant-translate/bundle.mpp.sha256 bundles/instant-translate/patch-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: Instant Translate experimental Morphe bundle [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
