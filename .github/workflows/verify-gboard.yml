name: Verify separate Gboard v4.0.0 bundle

on:
  workflow_dispatch:
  push:
    branches: [arena/bed34f3a-youtube-patch-clone]
    paths:
      - 'extras/gboard-patches/**'
      - 'bundles/gboard/**'
      - 'tools/gboard/**'
      - '.github/workflows/verify-gboard.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: gboard-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned source, Khmer catalog, and negative cases
        run: |
          set -euo pipefail
          python3 tools/gboard/verify_bundle.py --metadata-only --verify-vendor
          python3 tools/gboard/test_verification.py -v
      - name: Download and verify the exact upstream release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gboard-input
          gh release download v4.0.0 --repo jasonwu1994/Gboard-patches --pattern patches-4.0.0.mpp --dir /tmp/gboard-input
          cp /tmp/gboard-input/patches-4.0.0.mpp bundles/gboard/gboard-patches-4.0.0.mpp
          (cd bundles/gboard && sha256sum --check gboard-patches-4.0.0.mpp.sha256)
          python3 tools/gboard/verify_bundle.py --verify-vendor
      - name: Load the actual MPP using Morphe Desktop's patcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop --pattern morphe-desktop-1.19.1-all.jar --dir /tmp/gboard-input
          echo 'a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  /tmp/gboard-input/morphe-desktop-1.19.1-all.jar' | sha256sum --check
          java -Xmx2g -jar /tmp/gboard-input/morphe-desktop-1.19.1-all.jar list-patches \
            --patches bundles/gboard/gboard-patches-4.0.0.mpp --with-packages --with-versions \
            --out /tmp/gboard-input/desktop-patches.txt
          python3 tools/gboard/verify_bundle.py --verify-vendor \
            --cli-output /tmp/gboard-input/desktop-patches.txt \
            --write-report bundles/gboard/morphe-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: gboard-upstream-v4-verified
          path: |
            bundles/gboard/gboard-patches-4.0.0.mpp
            bundles/gboard/gboard-patches-4.0.0.mpp.sha256
            bundles/gboard/morphe-validation.json
            /tmp/gboard-input/desktop-patches.txt
      - name: Save only the verified Gboard bundle to the current session branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/bed34f3a-youtube-patch-clone'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/gboard-output
          files=(bundles/gboard/gboard-patches-4.0.0.mpp bundles/gboard/morphe-validation.json)
          for path in "${files[@]}"; do
            cp "$path" /tmp/gboard-output/
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git restore --source=HEAD --staged --worktree -- "$path"
            else
              rm -f "$path"
            fi
          done
          git pull --rebase origin "$GITHUB_REF_NAME"
          # Never replace output from newer source, metadata, or verifier revisions.
          for path in extras/gboard-patches tools/gboard bundles/gboard/upstream.json bundles/gboard/patches-list.json bundles/gboard/patches-bundle.json .github/workflows/verify-gboard.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$path")" != "$(git rev-parse "HEAD:$path")" ]; then
              echo "Gboard inputs changed during the run; the newer run will publish."
              exit 0
            fi
          done
          cp /tmp/gboard-output/gboard-patches-4.0.0.mpp bundles/gboard/
          cp /tmp/gboard-output/morphe-validation.json bundles/gboard/
          git add -f -- "${files[@]}"
          git diff --cached --quiet && exit 0
          git commit -m 'build: mirror verified upstream Gboard bundle [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"

  build-from-upstream-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source tree before building a temporary copy
        run: |
          python3 tools/gboard/verify_bundle.py --metadata-only --verify-vendor
          cp -a extras/gboard-patches /tmp/gboard-source
          # Upstream keeps gradlew non-executable in Git and chmods it in CI.
          # Change only the temporary build copy, not the verified source tree.
          chmod +x /tmp/gboard-source/gradlew
      - name: Build Gboard MPP and run upstream patch tests
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: /tmp/gboard-source
        run: |
          set -o pipefail
          ./gradlew :patches:test :patches:buildAndroid generatePatchesList --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/gboard-gradle.log
      - name: Run upstream extension unit tests
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: /tmp/gboard-source
        run: |
          set -o pipefail
          ./gradlew :extensions:calculator:testDebugUnitTest :extensions:extension:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/gboard-extension-tests.log
      - name: Compare generated selectable patch metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('bundles/gboard/patches-list.json').read_text(encoding='utf-8'))
          generated = json.loads(Path('/tmp/gboard-source/patches-list.json').read_text(encoding='utf-8'))
          if generated != expected:
              raise SystemExit('Built patch metadata does not match the vendored upstream release list')
          print('Generated patch metadata matches all 43 upstream entries')
          PY
      - name: Summarize source-build failures
        if: failure()
        run: |
          for log in /tmp/gboard-gradle.log /tmp/gboard-extension-tests.log; do
            if test -f "$log"; then
              grep -E -A 5 'What went wrong|Execution failed|Could not|FAILURE:|error:|Exception|Permission denied' "$log" | tail -40 | while IFS= read -r line; do echo "::error::$line"; done || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gboard-source-build-results
          if-no-files-found: ignore
          path: |
            /tmp/gboard-gradle.log
            /tmp/gboard-extension-tests.log
            /tmp/gboard-source/patches/build/test-results/test/*.xml
            /tmp/gboard-source/extensions/*/build/test-results/**/*.xml

  publish-approved-release:
    # Deliberately requires the explicit release marker on this session branch;
    # ordinary source changes or a PR do not create or replace a release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/bed34f3a-youtube-patch-clone' && contains(github.event.head_commit.message, '[gboard-release]')
    needs: [mirror-and-load, build-from-upstream-source]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release inputs and refuse an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/gboard/verify_bundle.py --verify-vendor
          python3 tools/gboard/test_verification.py
          git fetch --no-tags origin '+refs/heads/arena/bed34f3a-youtube-patch-clone:refs/remotes/origin/arena/bed34f3a-youtube-patch-clone'
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/arena/bed34f3a-youtube-patch-clone"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/Gboard-v4.0.0" --jq '[.[] | select(.ref == "refs/tags/Gboard-v4.0.0")] | length')"
          test "$existing" = 0 || { echo '::error::Gboard-v4.0.0 already exists; refusing to replace it.'; exit 1; }
      - name: Publish the separately named Gboard pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_before="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          gh release create Gboard-v4.0.0 \
            bundles/gboard/gboard-patches-4.0.0.mpp \
            bundles/gboard/gboard-patches-4.0.0.mpp.sha256 \
            bundles/gboard/patches-list.json \
            bundles/gboard/morphe-validation.json \
            --target "$GITHUB_SHA" --title 'Gboard patches v4.0.0' \
            --notes-file bundles/gboard/RELEASE_NOTES.md --prerelease --latest=false
          latest_after="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest_before" = "$latest_after" || { echo '::error::Existing latest release changed.'; exit 1; }
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/Gboard-v4.0.0" --jq .object.sha)"
          test "$tag_sha" = "$GITHUB_SHA" || { echo '::error::Release tag points to the wrong commit.'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/contents/bundles/gboard/patches-bundle.json?ref=Gboard-v4.0.0" --jq .content | base64 --decode > /tmp/gboard-released-source.json
          cmp bundles/gboard/patches-bundle.json /tmp/gboard-released-source.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/Gboard-v4.0.0" > /tmp/gboard-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('/tmp/gboard-release.json').read_text())
          assert release['tag_name'] == 'Gboard-v4.0.0' and release['prerelease'] and not release['draft']
          mpps = [asset for asset in release['assets'] if asset['name'].endswith('.mpp')]
          assert len(mpps) == 1 and mpps[0]['name'] == 'gboard-patches-4.0.0.mpp'
          assert mpps[0]['size'] == 8186810
          assert mpps[0]['digest'] == 'sha256:fadf54bea20f337a03baddf2bd294c86d254a744456c6e53ee13f4ad25a58716'
          print('Published release asset, pinned source, tag target, and unchanged latest release verified')
          PY
