name: Publish YouTube EQ bundle v1.48.2
on:
  workflow_dispatch:
  push:
    branches: [arena/e285a5a0-youtube-patch-clone]
    paths: ['.github/workflows/publish-youtube-1482.yml']
permissions:
  contents: write
concurrency:
  group: release-youtube-v1.48.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate exact release inputs
        run: |
          python3 .github/scripts/verify-mpp.py
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          version = '1.48.2'
          assert json.loads(Path('patches-bundle.json').read_text())['version'] == version
          assert json.loads(Path('patches-list.json').read_text())['version'] == version
          with zipfile.ZipFile('patch.mpp') as archive:
              manifest = archive.read('META-INF/MANIFEST.MF').decode().replace('\r', '')
              assert f'\nVersion: {version}\n' in manifest
              assert 'app/morphe/patches/youtube/video/audio/EqualizerPatchKt.class' in archive.namelist()
          PY
      - name: Upload all assets before publishing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v1.48.2 patch.mpp patch.mpp.sha256 patches-bundle.json --clobber
          gh release edit v1.48.2 --draft=false --latest
