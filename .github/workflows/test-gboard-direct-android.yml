name: Gboard direct-Translate Android emulator smoke

on:
  workflow_dispatch:
  push:
    branches: [arena/69154a0c-youtube-patch-clone]
    paths:
      - 'tools/gboard-translate/**'
      - '.github/workflows/test-gboard-direct-android.yml'

permissions:
  contents: write

concurrency:
  group: gboard-direct-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gboard-android-ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the already-built experimental MPP
        run: |
          set -euo pipefail
          (cd bundles/gboard-experimental && sha256sum --check gboard-direct-translate-experimental.mpp.sha256)
          python3 tools/gboard/verify_bundle.py --verify-vendor
          python3 tools/gboard-translate/test_fixture.py
          python3 tools/gboard-translate/test_emulator_smoke.py
      - name: Apply that MPP to a third-party-derived fixture, never stock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Fixture setup failed at line $LINENO (exit $status)"; if test -f /tmp/gboard-android-apply.log; then grep -E -A 3 "ERROR:|FAILED:|Exception|mismatch" /tmp/gboard-android-apply.log | tail -20 | while IFS= read -r line; do echo "::error::$line"; done || true; fi' ERR
          mkdir -p /tmp/gboard-android-input /tmp/gboard-android-output
          python -m pip install --disable-pip-version-check 'androguard==4.1.3'
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop \
            --pattern morphe-desktop-1.19.1-all.jar --dir /tmp/gboard-android-input
          echo 'a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  /tmp/gboard-android-input/morphe-desktop-1.19.1-all.jar' | sha256sum --check
          gh release download 'gboard-v18.5.4.993608717-release-arm64-v8a-p4.0.0' \
            --repo iamwaqargulzar/auto-morphe-apk-builds \
            --pattern 'gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk' --dir /tmp/gboard-android-input
          input=/tmp/gboard-android-input/gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk
          echo "1d9260f74430265bcf4087ae45d6a22f688d907fd5ed84998ea15d4eac4e93ea  $input" | sha256sum --check
          python3 tools/gboard-translate/make_manifest_fixture.py "$input" /tmp/gboard-android-input/fixture.apk
          java -Xmx3g -jar /tmp/gboard-android-input/morphe-desktop-1.19.1-all.jar patch \
            --patches bundles/gboard-experimental/gboard-direct-translate-experimental.mpp \
            --exclusive --enable 'Direct Google Translate (experimental)' --bytecode-mode FULL \
            --out /tmp/gboard-android-output/fixture-patched.apk \
            --result-file /tmp/gboard-android-output/patch-result.json \
            /tmp/gboard-android-input/fixture.apk 2>&1 | tee /tmp/gboard-android-apply.log
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/gboard-android-output/patch-result.json'))
          assert result['success'] and not result['failedPatches']
          assert 'Direct Google Translate (experimental)' in result['appliedPatches']
          PY
          python3 tools/gboard-translate/verify_fixture_apk.py /tmp/gboard-android-output/fixture-patched.apk
          # The Google APIs emulator has a system-signed Gboard. Restore the
          # prepatched sample's distinct package name solely for installation,
          # then align and sign with a throwaway CI key. This is not stock APK.
          python3 tools/gboard-translate/make_manifest_fixture.py \
            /tmp/gboard-android-output/fixture-patched.apk /tmp/gboard-android-output/fixture-restored-unsigned.apk --restore
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          "$tools/zipalign" -p -f 4 /tmp/gboard-android-output/fixture-restored-unsigned.apk /tmp/gboard-android-output/fixture-aligned.apk
          keytool -genkeypair -noprompt -keystore /tmp/gboard-android-output/test.keystore \
            -storepass android -keypass android -alias test -dname 'CN=Gboard emulator test' \
            -keyalg RSA -keysize 2048 -validity 2 > /dev/null 2>&1
          "$tools/apksigner" sign --ks /tmp/gboard-android-output/test.keystore --ks-pass pass:android --key-pass pass:android \
            --out /tmp/gboard-android-output/fixture-emulator.apk /tmp/gboard-android-output/fixture-aligned.apk
          "$tools/aapt" dump badging /tmp/gboard-android-output/fixture-emulator.apk | sed -n '1p' \
            | grep -F "name='dev.jason.com.google.android.inputmethod.latin'"
      - name: Enable emulator acceleration when available
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
          else
            echo '::warning::KVM is not available; emulator may be too slow to start.'
          fi
      - name: Try an Android 15 Google APIs emulator with ARM64 translation
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/gboard-translate/emulator_smoke.py /tmp/gboard-android-output/fixture-emulator.apk /tmp/gboard-android-output/android-smoke.json
      - name: Record the exact emulator outcome without publishing the APK
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gboard-android-output
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path('/tmp/gboard-android-output/android-smoke.json')
          data = json.loads(output.read_text()) if output.exists() else {
              'environment': 'Android emulator only, not the user device or network',
              'synthetic_android_java_https': 'not run', 'fixture_install': 'not run',
              'ime_process_started': 'not run', 'translate_ui_functionality': 'not tested',
          }
          asset = Path('bundles/gboard-experimental/gboard-direct-translate-experimental.mpp')
          data['bundle_sha256'] = hashlib.sha256(asset.read_bytes()).hexdigest()
          data['emulator_action_outcome'] = os.environ.get('EMULATOR_OUTCOME') or 'not run'
          data['run_url'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          output.write_text(json.dumps(data, indent=2) + '\n')
          print(json.dumps(data, indent=2))
          PY
      - name: Save only the sanitized emulator report to this branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/arena/69154a0c-youtube-patch-clone'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          for path in tools/gboard-translate bundles/gboard-experimental/gboard-direct-translate-experimental.mpp .github/workflows/test-gboard-direct-android.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$path")" != "$(git rev-parse "HEAD:$path")" ]; then
              echo 'Emulator inputs changed during the run; refusing to publish an outdated report.'
              exit 0
            fi
          done
          cp /tmp/gboard-android-output/android-smoke.json bundles/gboard-experimental/android-smoke.json
          git add bundles/gboard-experimental/android-smoke.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record experimental Gboard Android smoke [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gboard-direct-emulator-sanitized-report
          if-no-files-found: ignore
          path: |
            /tmp/gboard-android-output/android-smoke.json
            /tmp/gboard-android-output/patch-result.json
            /tmp/gboard-android-apply.log
