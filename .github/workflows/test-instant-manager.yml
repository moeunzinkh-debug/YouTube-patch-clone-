name: Test Instant Translate in Morphe Manager

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - 'bundles/instant-translate/bundle.mpp'
      - 'tools/instant-translate/test_manager.py'
      - 'tools/instant-translate/verify_manager.py'
      - 'tools/instant-translate/verify_patched.py'
      - '.github/workflows/test-instant-manager.yml'

permissions:
  contents: write

concurrency:
  group: instant-manager-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manager:
    if: contains(github.event.head_commit.message, '[instant-manager]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Manager and supplied APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/instant-manager
          gh release download v2.3.0-dev.3 --repo MorpheApp/morphe-manager --pattern morphe-manager-2.3.0-dev.3.apk --dir /tmp/instant-manager
          name='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$name" --dir /tmp/instant-manager
          echo '9b9cbd8d3e0c4394f87c1a5675db6ff2e473233e316bf2915f6fe447347e5d96  /tmp/instant-manager/morphe-manager-2.3.0-dev.3.apk' | sha256sum --check
          echo 'f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  /tmp/instant-manager/'"$name" | sha256sum --check
          python3 tools/instant-translate/verify_bundle.py --mpp bundles/instant-translate/bundle.mpp
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Import, explicitly select and apply the opt-in MPP in Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tools/instant-translate/test_manager.py
      - name: Verify Manager-saved APK and native libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          "$tools/apksigner" verify --min-sdk-version 29 /tmp/instant-manager/manager-merged-patched.apk
          if ! python3 tools/instant-translate/verify_manager.py \
            '/tmp/instant-manager/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk' \
            /tmp/instant-manager/manager-merged-patched.apk bundles/instant-translate/bundle.mpp \
            /tmp/instant-manager/manager-smoke.json > /tmp/instant-manager/verify.log 2>&1; then
            tail -n 15 /tmp/instant-manager/verify.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo '::notice::Morphe Manager saved a signed APK with both selected patches and the original integrity check; runtime still requires separate testing.'
      - uses: actions/upload-artifact@v4
        with:
          name: instant-manager-validation
          path: /tmp/instant-manager/manager-smoke.json
      - name: Save sanitized validation report
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          for source in bundles/instant-translate/bundle.mpp tools/instant-translate/project tools/instant-translate/test_manager.py tools/instant-translate/verify_manager.py tools/instant-translate/verify_patched.py .github/workflows/test-instant-manager.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$source")" != "$(git rev-parse "HEAD:$source")" ]; then
              echo '::warning::Manager inputs changed; not saving stale results.'
              exit 0
            fi
          done
          cp /tmp/instant-manager/manager-smoke.json bundles/instant-translate/manager-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundles/instant-translate/manager-smoke.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record Instant Translate Manager patch validation [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
