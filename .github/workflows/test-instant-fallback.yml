name: Exercise Instant Translate fallback with CI-only fault

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - 'bundles/instant-translate/bundle.mpp'
      - 'tools/instant-translate/ForceOriginalFailure.kt'
      - 'tools/instant-translate/verify_forced.py'
      - 'tools/instant-translate/probe_runtime.py'
      - 'tools/instant-translate/check_runtime.py'
      - '.github/workflows/test-instant-fallback.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: instant-fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fallback:
    if: contains(github.event.head_commit.message, '[instant-forced]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare pinned input and a separate CI-only fault patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/instant-translate/verify_bundle.py --mpp bundles/instant-translate/bundle.mpp
          mkdir -p "$RUNNER_TEMP/instant-fallback"
          name='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$name" --dir "$RUNNER_TEMP/instant-fallback"
          gh release download v1.20.0-dev.1 --repo MorpheApp/morphe-desktop --pattern morphe-desktop-1.20.0-dev.1-all.jar --dir "$RUNNER_TEMP/instant-fallback"
          echo 'f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  '"$RUNNER_TEMP/instant-fallback/$name" | sha256sum --check
          echo '20c2cf951373f4e47092a7c9312519ecfd4b2826ddc114b134e0ad503af53fdb  '"$RUNNER_TEMP/instant-fallback/morphe-desktop-1.20.0-dev.1-all.jar" | sha256sum --check
          python3 tools/instant-translate/prepare_build.py "$RUNNER_TEMP/instant-ci-only"
          src="$RUNNER_TEMP/instant-ci-only/patches/src/main/kotlin/app/morphe/patches/instanttranslate"
          rm "$src/TranslationFallbackPatch.kt"
          cp tools/instant-translate/ForceOriginalFailure.kt "$src/ForceOriginalFailure.kt"
      - name: Build the CI-only failure-injection patch (never distribute)
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/instant-ci-only"
          ./gradlew :patches:buildAndroid --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$RUNNER_TEMP/instant-ci-only.log"
      - name: Apply real MPP and then CI-only fault; sign disposable test APKs
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/instant-fallback"
          input="$dir/Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk"
          desktop="$dir/morphe-desktop-1.20.0-dev.1-all.jar"
          mapfile -t candidates < <(find "$RUNNER_TEMP/instant-ci-only/patches/build/libs" -maxdepth 1 -name '*.mpp' -type f)
          test "${#candidates[@]}" -eq 1
          if ! java -Xmx4g -jar "$desktop" patch "$input" -p bundles/instant-translate/bundle.mpp --exclusive \
            -e 'Translation fallback (Google, experimental)' --unsigned -o "$dir/product-unsigned.apk" \
            -r "$dir/product-result.json" > "$dir/product-patch.log" 2>&1; then
            tail -n 30 "$dir/product-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          if ! java -Xmx4g -jar "$desktop" patch "$dir/product-unsigned.apk" -p "${candidates[0]}" --exclusive \
            -e 'CI only: force original translation failure' --unsigned -o "$dir/forced-unsigned.apk" \
            -r "$dir/forced-result.json" > "$dir/forced-patch.log" 2>&1; then
            tail -n 30 "$dir/forced-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          if ! python3 tools/instant-translate/verify_forced.py "$input" "$dir/forced-unsigned.apk" > "$dir/verify.log" 2>&1; then
            tail -n 20 "$dir/verify.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          tools="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1 | xargs dirname)"
          keytool -genkeypair -keystore "$dir/test.jks" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Emulator Test' >/dev/null 2>&1
          for mode in product forced; do
            "$tools/zipalign" -f -p 4 "$dir/$mode-unsigned.apk" "$dir/$mode-aligned.apk"
            "$tools/apksigner" sign --ks "$dir/test.jks" --ks-pass pass:android --key-pass pass:android \
              --out "$dir/$mode-signed.apk" "$dir/$mode-aligned.apk"
            "$tools/apksigner" verify --min-sdk-version 29 "$dir/$mode-signed.apk"
          done
      - name: Probe Google with synthetic fixture only
        run: |
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          from urllib.request import ProxyHandler, build_opener
          spec = importlib.util.spec_from_file_location('probe', 'tools/gboard/probe_google_translate.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          opener = build_opener(ProxyHandler({}), module.NoRedirect())
          result = module.run_case(opener, {'source': 'es', 'target': 'en', 'text': 'hola', 'method': 'POST'})
          Path(os.environ['RUNNER_TEMP'], 'instant-fallback', 'provider.json').write_text(json.dumps(result))
          print(f"::notice::Synthetic Google endpoint probe: {result['status']} HTTP {result.get('http_status', 'unavailable')}")
          PY
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Launch product and CI-fault APKs with the same synthetic text
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            export INSTANT_CLEAR=1 INSTANT_RESULT_WAIT=50
            export INSTANT_APK="$RUNNER_TEMP/instant-fallback/product-signed.apk" INSTANT_REPORT="$RUNNER_TEMP/instant-fallback/product.json" INSTANT_MODE=product
            python3 tools/instant-translate/probe_runtime.py
            export INSTANT_APK="$RUNNER_TEMP/instant-fallback/forced-signed.apk" INSTANT_REPORT="$RUNNER_TEMP/instant-fallback/forced.json" INSTANT_MODE=ci-forced-original-failure
            python3 tools/instant-translate/probe_runtime.py
      - name: Evaluate the CI-only forced-failure fixture
        run: |
          if ! python3 tools/instant-translate/check_runtime.py "$RUNNER_TEMP/instant-fallback/product.json" \
            "$RUNNER_TEMP/instant-fallback/forced.json" "$RUNNER_TEMP/instant-fallback/runtime-validation.json" > "$RUNNER_TEMP/instant-fallback/check.log" 2>&1; then
            tail -n 18 "$RUNNER_TEMP/instant-fallback/check.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo '::notice::CI-only forced original failure produced a Google translation of the synthetic fixture.'
      - name: Report sanitized runtime diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'instant-fallback'
          for mode in ('product', 'forced', 'provider'):
              file = directory / f'{mode}.json'
              if file.exists():
                  data = base64.b64encode(gzip.compress(file.read_bytes())).decode()
                  chunks = [data[i:i+3900] for i in range(0, len(data), 3900)]
                  if len(chunks) <= 3:
                      for i, chunk in enumerate(chunks, 1):
                          print(f'::notice::INSTANT_{mode.upper()} {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instant-fallback-emulator-validation
          path: |
            ${{ runner.temp }}/instant-fallback/product.json
            ${{ runner.temp }}/instant-fallback/forced.json
            ${{ runner.temp }}/instant-fallback/provider.json
            ${{ runner.temp }}/instant-fallback/runtime-validation.json
          if-no-files-found: ignore
      - name: Save sanitized successful fixture report
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          for source in bundles/instant-translate/bundle.mpp tools/instant-translate/ForceOriginalFailure.kt tools/instant-translate/verify_forced.py tools/instant-translate/probe_runtime.py tools/instant-translate/check_runtime.py .github/workflows/test-instant-fallback.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$source")" != "$(git rev-parse "HEAD:$source")" ]; then
              echo '::warning::Runtime test inputs changed; not saving stale results.'
              exit 0
            fi
          done
          cp "$RUNNER_TEMP/instant-fallback/runtime-validation.json" bundles/instant-translate/runtime-validation.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundles/instant-translate/runtime-validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record Instant Translate forced-failure emulator fixture [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
