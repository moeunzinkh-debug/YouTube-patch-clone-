name: Build standalone Gemini reference bundle
on:
  workflow_dispatch:
  push:
    branches: [arena/b0221262-youtube-patch-clone]
    paths:
      - '.github/workflows/build-gemini-mpp.yml'
permissions:
  contents: write
concurrency:
  group: gemini-reference-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ryuya0124/gemini-microg-patches
          ref: cef25d12c71c33f555b52d8330c1ca886bf59ccc
          path: .gemini-build
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build pinned Gemini source in isolation
        working-directory: .gemini-build
        run: |
          set -euo pipefail
          scripts/setup-tools.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          scripts/build-mpp.sh
          scripts/check-hook-profiles.sh
      - name: Collect and verify Gemini-only output
        run: |
          set -euo pipefail
          cp .gemini-build/build/release/gemini-microg-patches-0.1.1.mpp bundles/gemini/gemini-reference.mpp
          cp .gemini-build/build/mpp-patch-list.txt bundles/gemini/patch-list.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('bundles/gemini/gemini-reference.mpp') as z:
              names = z.namelist()
              assert 'classes.dex' in names
              assert any(n.startswith('app/morphe/patches/google/') for n in names)
              assert not any('/patches/youtube/' in n for n in names)
          PY
          cd bundles/gemini
          sha256sum gemini-reference.mpp > gemini-reference.mpp.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-reference-mpp-not-target-verified
          path: bundles/gemini/
          retention-days: 14
      - name: Save standalone build to session branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f bundles/gemini/gemini-reference.mpp bundles/gemini/gemini-reference.mpp.sha256 bundles/gemini/patch-list.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build: standalone Gemini reference bundle (not target verified)'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
