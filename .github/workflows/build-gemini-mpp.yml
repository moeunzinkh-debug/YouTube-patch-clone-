name: Build standalone Gemini target bundle
on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/build-gemini-mpp.yml'
      - 'tools/gemini-apk/overlay/**'
      - 'tools/gemini-apk/prepare_build.py'
      - 'tools/gemini-apk/verify_patched.py'
      - 'tools/gemini-apk/verify_google.py'
      - 'tools/gemini-apk/publish-bundle.sh'
      - 'tools/gemini-apk/tests/**'
permissions:
  contents: write
concurrency:
  group: gemini-reference-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ryuya0124/gemini-microg-patches
          ref: cef25d12c71c33f555b52d8330c1ca886bf59ccc
          path: .gemini-build
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test profile evidence
        run: python3 -m unittest discover -s tools/gemini-apk/tests -v
      - name: Apply Gemini 345 profile overlay
        run: python3 tools/gemini-apk/prepare_build.py .gemini-build
      - name: Build pinned Gemini source in isolation
        working-directory: .gemini-build
        run: |
          set -euo pipefail
          scripts/setup-tools.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          scripts/build-mpp.sh

      - name: Test both Gemini patches on the uploaded exact APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download Gemini --repo "$GITHUB_REPOSITORY" --pattern base.apk --dir "$RUNNER_TEMP/gemini"
          echo "bfa9b10060a1c0e8a1c3f2b01cd513f74a53b364ab9bdb1bca02ae103de3f7e5  $RUNNER_TEMP/gemini/base.apk" | sha256sum -c -
          cd .gemini-build/build
          set -o pipefail
          java -Xmx2g -jar ../tools/morphe-desktop.jar patch "$RUNNER_TEMP/gemini/base.apk" -p release/gemini-microg-patches-0.1.3.mpp --unsigned -o "$RUNNER_TEMP/gemini/patched.apk" -r ../../bundles/gemini/patch-result.json 2>&1 | tee "$RUNNER_TEMP/gemini-patch.log"
      - name: Verify patched DEX and manifest
        run: |
          pip install androguard==4.1.3
          python3 tools/gemini-apk/verify_patched.py "$RUNNER_TEMP/gemini/patched.apk"
      - name: Test Google target and Clone app prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download Google --repo "$GITHUB_REPOSITORY" --pattern base.apk --dir "$RUNNER_TEMP/google"
          echo "f9e5d898a8bae360e6d8654f1871b920e1a2774701fe716f4e64bb0c803b7bd9  $RUNNER_TEMP/google/base.apk" | sha256sum -c -
          cd .gemini-build/build
          java -Xmx5g -jar ../tools/morphe-desktop.jar patch "$RUNNER_TEMP/google/base.apk" -p release/gemini-microg-patches-0.1.3.mpp -p ../tools/patches.mpp -e 'Clone app' -O updatePermissions=true -O updateProviders=true --unsigned -o "$RUNNER_TEMP/google/patched.apk" -r ../../bundles/gemini/google-patch-result.json 2>&1 | tee "$RUNNER_TEMP/google-patch.log"
      - name: Verify Google patch results and permission
        run: |
          python3 tools/gemini-apk/verify_google.py "$RUNNER_TEMP/google/patched.apk"
      - name: Report patch failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/gemini-patch.log"; then
            tail -25 "$RUNNER_TEMP/gemini-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Report Google patch failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/google-patch.log"; then
            tail -35 "$RUNNER_TEMP/google-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Collect and verify Gemini-only output
        run: |
          set -euo pipefail
          cp .gemini-build/build/release/gemini-microg-patches-0.1.3.mpp bundles/gemini/gemini-target.mpp
          cp .gemini-build/build/mpp-patch-list.txt bundles/gemini/patch-list.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('bundles/gemini/gemini-target.mpp') as z:
              names = z.namelist()
              assert 'classes.dex' in names
              assert any(n.startswith('app/morphe/patches/google/') for n in names)
              assert not any('/patches/youtube/' in n for n in names)
          PY
          cp bundles/gemini/gemini-target.mpp bundles/gemini/bundle.mpp
          cd bundles/gemini
          sha256sum bundle.mpp > bundle.mpp.sha256
          sha256sum gemini-target.mpp > gemini-target.mpp.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-345-target-mpp-device-testing-pending
          path: bundles/gemini/
          retention-days: 14
      - name: Save standalone build to branch without force pushing
        run: bash tools/gemini-apk/publish-bundle.sh
