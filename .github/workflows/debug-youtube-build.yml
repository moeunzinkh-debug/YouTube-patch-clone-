name: Inspect YouTube CI failure
on:
  push:
    branches: [arena/c4f8fd6a-youtube-patch-clone]
    paths: ['.github/workflows/debug-youtube-build.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Surface failure
        run: |
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/124819044496/logs" > "$RUNNER_TEMP/job.log"
          python3 - <<'PY'
          import os, re
          text = open(os.environ['RUNNER_TEMP'] + '/job.log', encoding='utf-8', errors='replace').read()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          i = text.find('##[error]Process completed with exit code')
          text = text[max(0, i-3200):i+250] if i >= 0 else text[-3400:]
          print('::warning::' + text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
