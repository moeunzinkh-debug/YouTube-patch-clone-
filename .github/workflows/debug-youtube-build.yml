name: Inspect YouTube build failure
on:
  push:
    branches: [arena/c4f8fd6a-youtube-patch-clone]
    paths: ['.github/workflows/debug-youtube-build.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Surface previous verification failure
        run: |
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/124816478295/logs" > "$RUNNER_TEMP/job.log" 2> "$RUNNER_TEMP/job-error" || {
            python3 -c 'import os; print("::error::" + open(os.environ["RUNNER_TEMP"] + "/job-error").read().replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          }
          python3 - <<'PY'
          import os
          path = os.environ['RUNNER_TEMP'] + '/job.log'
          text = ''.join(open(path, encoding='utf-8', errors='replace').readlines()[-60:])[-3300:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::warning::' + text)
          PY
