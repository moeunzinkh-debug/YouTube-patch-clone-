name: Build experimental Google process identity bundle
on:
  workflow_dispatch:
    inputs:
      require_apk_tests:
        description: 'Require uploaded Gemini and Google APKs and fail if unavailable'
        type: boolean
        default: false
  push:
    branches: [main, 'arena/**']
    paths:
      - 'tools/gemini-experimental/**'
      - '.github/workflows/build-gemini-experimental.yml'
permissions:
  contents: write
concurrency:
  group: gemini-experimental-build-${{ github.ref }}
  cancel-in-progress: false
env:
  GEMINI_OUTPUT_DIR: bundles/gemini-experimental
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ryuya0124/gemini-microg-patches
          ref: cef25d12c71c33f555b52d8330c1ca886bf59ccc
          path: .gemini-build
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test profile evidence
        run: python3 -m unittest discover -s tools/gemini-apk/tests -v
      - name: Apply Gemini 345 profile overlay
        run: python3 tools/gemini-experimental/prepare.py .gemini-build
      - name: Build pinned Gemini source in isolation
        working-directory: .gemini-build
        run: |
          set -euo pipefail
          scripts/setup-tools.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          scripts/build-mpp.sh

      - name: Check availability of exact APK test inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_APK_TESTS: ${{ github.event_name == 'push' || inputs.require_apk_tests }}
        run: |
          python3 tools/gemini-apk/fetch_test_inputs.py
      - name: Test both Gemini patches on the uploaded exact APK
        if: steps.inputs.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "bfa9b10060a1c0e8a1c3f2b01cd513f74a53b364ab9bdb1bca02ae103de3f7e5  $RUNNER_TEMP/gemini/base.apk" | sha256sum -c -
          cd .gemini-build/build
          set -o pipefail
          java -Xmx2g -jar ../tools/morphe-desktop.jar patch "$RUNNER_TEMP/gemini/base.apk" -p release/gemini-microg-patches-0.2.0.mpp --unsigned -o "$RUNNER_TEMP/gemini/patched.apk" -r ../../bundles/gemini-experimental/patch-result.json 2>&1 | tee "$RUNNER_TEMP/gemini-patch.log"
      - name: Verify patched DEX and manifest
        if: steps.inputs.outputs.available == 'true'
        run: |
          pip install androguard==4.1.3
          python3 tools/gemini-apk/verify_patched.py "$RUNNER_TEMP/gemini/patched.apk"
      - name: Test Google target and Clone app prerequisite
        if: steps.inputs.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "f9e5d898a8bae360e6d8654f1871b920e1a2774701fe716f4e64bb0c803b7bd9  $RUNNER_TEMP/google/base.apk" | sha256sum -c -
          cd .gemini-build/build
          java -Xmx5g -jar ../tools/morphe-desktop.jar patch "$RUNNER_TEMP/google/base.apk" -p release/gemini-microg-patches-0.2.0.mpp -p ../tools/patches.mpp -e 'Clone app' -O updatePermissions=true -O updateProviders=true --unsigned -o "$RUNNER_TEMP/google/patched.apk" -r ../../bundles/gemini-experimental/google-patch-result.json 2>&1 | tee "$RUNNER_TEMP/google-patch.log"
      - name: Verify Google patch results and permission
        if: steps.inputs.outputs.available == 'true'
        run: |
          python3 tools/gemini-apk/verify_google.py "$RUNNER_TEMP/google/patched.apk"
      - name: Report patch failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/gemini-patch.log"; then
            tail -25 "$RUNNER_TEMP/gemini-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Report Google patch failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/google-patch.log"; then
            tail -35 "$RUNNER_TEMP/google-patch.log" | while IFS= read -r line; do echo "::error::$line"; done
          fi
      - name: Collect and verify Gemini-only output
        run: |
          set -euo pipefail
          cp .gemini-build/build/release/gemini-microg-patches-0.2.0.mpp bundles/gemini-experimental/gemini-target.mpp
          cp .gemini-build/build/mpp-patch-list.txt bundles/gemini-experimental/patch-list.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('bundles/gemini-experimental/gemini-target.mpp') as z:
              names = z.namelist()
              assert 'classes.dex' in names
              assert any(n.startswith('app/morphe/patches/google/') for n in names)
              assert not any('/patches/youtube/' in n for n in names)
          PY
          cp bundles/gemini-experimental/gemini-target.mpp bundles/gemini-experimental/bundle.mpp
          cd bundles/gemini
          sha256sum bundle.mpp > bundle.mpp.sha256
          sha256sum gemini-target.mpp > gemini-target.mpp.sha256
      - name: Record this run's validation scope
        env:
          APK_TESTS_AVAILABLE: ${{ steps.inputs.outputs.available }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          data = {'compiled': True, 'apk_tests': 'passed' if os.environ['APK_TESTS_AVAILABLE'] == 'true' else 'not-run-inputs-missing', 'device_runtime_tested': False, 'run_id': os.environ['GITHUB_RUN_ID'], 'source_commit': os.environ['GITHUB_SHA']}
          Path('bundles/gemini-experimental/build-status.json').write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Gemini bundle build\n\nCompiled: yes\n\nAPK tests: ' + data['apk_tests'] + '\n\nDevice runtime: not tested\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-process-experiment-device-testing-required
          path: |
            bundles/gemini-experimental/bundle.mpp
            bundles/gemini-experimental/bundle.mpp.sha256
            bundles/gemini-experimental/build-status.json
            bundles/gemini-experimental/README.md
          retention-days: 14
      - name: Save standalone build to branch without force pushing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f bundles/gemini-experimental/
          if ! git diff --cached --quiet; then
            git commit -m 'build: isolated experimental Google process identity bundle'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
