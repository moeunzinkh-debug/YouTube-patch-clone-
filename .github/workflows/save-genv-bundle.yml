name: Save tested GenV bundle to the working branch

on:
  push:
    branches: [arena/3655779f-youtube-patch-clone]
    paths:
      - '.github/workflows/save-genv-bundle.yml'
      - 'bundles/genv/README.md'

permissions:
  contents: write
  actions: read

jobs:
  save:
    if: contains(github.event.head_commit.message, '[genv-save-tested]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Retrieve only successful source-matched results
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/genv-delivery"
          mkdir -p "$work"/{bundle,manager,android,guard24,guard35}
          common=(tools/genv/project tools/genv/prepare_build.py tools/genv/verify_bundle.py tools/genv/verify_patched.py tools/genv/verify_microg_patched.py tools/genv/inspect_genv.py tools/genv/inspect_google_auth.py .github/workflows/build-genv-mpp.yml)
          static="$(python3 tools/king-patcher/find_successful_run.py "$GITHUB_REF_NAME" build-genv-mpp.yml "${common[@]}")"
          manager="$(python3 tools/king-patcher/find_successful_run.py "$GITHUB_REF_NAME" test-genv-manager.yml \
            "${common[@]}" tools/genv/test_manager.py tools/genv/verify_manager_output.py .github/workflows/test-genv-manager.yml)"
          android="$(python3 tools/king-patcher/find_successful_run.py "$GITHUB_REF_NAME" test-genv-android.yml \
            "${common[@]}" tools/genv/tests/android .github/workflows/test-genv-android.yml)"
          guard="$(python3 tools/king-patcher/find_successful_run.py "$GITHUB_REF_NAME" test-genv-microg.yml \
            "${common[@]}" tools/genv/trace_google_auth.py tools/genv/tests/microg .github/workflows/test-genv-microg.yml)"
          gh run download "$static" --name genv-morphe-bundle-static-only --dir "$work/bundle"
          gh run download "$manager" --name genv-manager-smoke --dir "$work/manager"
          gh run download "$android" --name genv-synthetic-android-report --dir "$work/android"
          gh run download "$guard" --name genv-microg-guard-api-24 --dir "$work/guard24"
          gh run download "$guard" --name genv-microg-guard-api-35 --dir "$work/guard35"
          (cd "$work/bundle" && sha256sum --check bundle.mpp.sha256)
          python3 tools/genv/verify_bundle.py --mpp "$work/bundle/bundle.mpp" --listing "$work/bundle/patches.txt"
          python3 - "$work" "$static" "$manager" "$android" "$guard" <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1]); static,manager,android,guard=sys.argv[2:]
          bundle=root/'bundle/bundle.mpp'; digest=hashlib.sha256(bundle.read_bytes()).hexdigest()
          p=json.loads((root/'bundle/patch-validation.json').read_text())
          g=json.loads((root/'bundle/microg-static.json').read_text())
          m=json.loads((root/'manager/manager-smoke.json').read_text())
          a=json.loads((root/'android/android-smoke.json').read_text())
          tests=[json.loads((root/f'guard{api}'/f'guard-{api}.json').read_text()) for api in (24,35)]
          assert p.get('status')=='passed_actual_mpp_patch_and_dex_inspection'
          assert p.get('input_sha256')=='f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e'
          assert g.get('status')=='passed_morphe_microg_static' and g.get('source_signer_certificate_checked_before_metadata')
          assert m.get('manager_patch_incomplete_base')=='passed' and m.get('bundle_sha256')==digest
          assert m.get('saved_output_microg_routing_and_manifest')=='passed_morphe_microg_static'
          assert a.get('status')=='passed' and a.get('bundle_sha256')==digest
          assert a.get('before_patch_check_calls_and_init_calls')==[2,1] and a.get('after_patch_check_calls_and_init_calls')==[0,0]
          assert a.get('wrong_version_code_rejected') and a.get('changed_opcode_rejected') and a.get('microg_wrong_version_and_unsigned_input_rejected')
          for api,test in zip((24,35),tests):
              assert test.get('status')=='passed' and test.get('bundle_sha256')==digest
              assert test.get('android_emulator_api')==str(api)
              assert all(test.get(key) is True for key in ('guard_from_actual_mpp_extension_dex','no_package_rejected',
                  'same_package_wrong_signer_rejected','official_morphe_microg_7_3_0_universal_accepted',
                  'official_signin_service_and_activity_selected','disabled_official_package_rejected_then_enabled',
                  'synthetic_stale_mode_refreshed_only_with_actual_guard_acceptance'))
              assert test.get('official_microg_apk_sha256')=='67b794fd5221512a11d5950ec214fc0af0e3a8f72840d01235920729c7e73f5e'
          result={
            'bundle_version':'0.2.0-dev.2', 'bundle_sha256':digest, 'bundle_bytes':bundle.stat().st_size,
            'input_package':'com.ainate.ai.video.generate', 'version':'3.7.2', 'version_code':163,
            'input_sha256':p['input_sha256'], 'patches':['Remove license check','Morphe MicroG Google sign-in support (experimental)'],
            'static_build':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{static}",
            'manager_test':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{manager}",
            'synthetic_android_test':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{android}",
            'offline_microg_guard_android_24_35':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{guard}",
            'input_limitations':'release asset is an incomplete base APK; required splits and native libraries were not supplied',
            'real_app_runtime_full_split_merge_live_login_server_attestation_and_purchases':'not tested',
          }
          (root/'validation.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Save only the MPP and sanitized reports on this session branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = arena/3655779f-youtube-patch-clone
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- tools/genv/project tools/genv/prepare_build.py tools/genv/verify_bundle.py \
              tools/genv/verify_patched.py tools/genv/verify_microg_patched.py tools/genv/inspect_genv.py tools/genv/inspect_google_auth.py \
              tools/genv/trace_google_auth.py tools/genv/test_manager.py tools/genv/verify_manager_output.py tools/genv/tests/android tools/genv/tests/microg \
              .github/workflows/build-genv-mpp.yml .github/workflows/test-genv-manager.yml .github/workflows/test-genv-android.yml .github/workflows/test-genv-microg.yml; then
            echo '::error::Relevant sources changed during delivery; refusing to save stale results.'
            exit 1
          fi
          work="$RUNNER_TEMP/genv-delivery"
          mkdir -p bundles/genv
          cp "$work/bundle/bundle.mpp" "$work/bundle/bundle.mpp.sha256" "$work/bundle/patches.txt" "$work/bundle/patch-validation.json" "$work/bundle/microg-static.json" bundles/genv/
          cp "$work/validation.json" bundles/genv/
          cp "$work/manager/manager-smoke.json" bundles/genv/
          cp "$work/android/android-smoke.json" bundles/genv/
          cp "$work/guard24/guard-24.json" bundles/genv/microg-guard-api24.json
          cp "$work/guard35/guard-35.json" bundles/genv/microg-guard-api35.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundles/genv/{bundle.mpp,bundle.mpp.sha256,patches.txt,patch-validation.json,microg-static.json,validation.json,manager-smoke.json,android-smoke.json,microg-guard-api24.json,microg-guard-api35.json}
          if git diff --cached --quiet; then echo 'Bundle already saved'; exit 0; fi
          git commit -m 'Add tested experimental GenV Morphe MicroG bundle [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo '::notice::Saved only the MPP and sanitized reports. No release or APK was changed.'
