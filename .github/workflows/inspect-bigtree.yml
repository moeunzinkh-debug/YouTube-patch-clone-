name: Inspect uploaded BigTree APK
on:
  push:
    branches: [arena/870bf1a6-youtube-patch-clone]
    paths: ['.github/workflows/inspect-bigtree.yml', 'tools/bigtree/inspect_apk.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Download exact pre-release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bigtree
          gh release download BigTree --pattern bigtree.apk --dir /tmp/bigtree
          echo '51b7b05b0171d0f242b37933af8c570dae50b6da3b33a0bfa7dce5814c08977a  /tmp/bigtree/bigtree.apk' | sha256sum --check
      - name: Inventory APK
        run: |
          python3 -m pip install 'androguard==4.1.3'
          python3 tools/bigtree/inspect_apk.py /tmp/bigtree/bigtree.apk docs/bigtree/apk-inventory.json
      - name: Save non-APK evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/bigtree/apk-inventory.json
          git commit -m 'analysis: inventory BigTree APK [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: bigtree-static-inventory
          path: docs/bigtree/apk-inventory.json
