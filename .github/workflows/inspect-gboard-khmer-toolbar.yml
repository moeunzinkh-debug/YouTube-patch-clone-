name: Inspect Gboard toolbar integration

on:
  workflow_dispatch:
  push:
    branches: [arena/383e624b-youtube-patch-clone]
    paths:
      - 'tools/gboard-khmer/trace_toolbar.py'
      - '.github/workflows/inspect-gboard-khmer-toolbar.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gboard-toolbar-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'androguard==4.1.3'
      - name: Inspect only the pinned third-party fixture; no APK is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gboard-toolbar-inspect
          gh release download 'gboard-v18.5.4.993608717-release-arm64-v8a-p4.0.0' \
            --repo iamwaqargulzar/auto-morphe-apk-builds \
            --pattern 'gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk' \
            --dir /tmp/gboard-toolbar-inspect
          input=/tmp/gboard-toolbar-inspect/gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk
          echo "1d9260f74430265bcf4087ae45d6a22f688d907fd5ed84998ea15d4eac4e93ea  $input" | sha256sum --check
          python tools/gboard-khmer/trace_toolbar.py "$input"
