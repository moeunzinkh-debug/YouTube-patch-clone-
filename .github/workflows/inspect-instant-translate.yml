name: Inspect Instant Translate release APK

on:
  push:
    branches: [arena/b6e2f975-youtube-patch-clone]
    paths:
      - .github/workflows/inspect-instant-translate.yml
      - tools/instant-translate/inspect_apk.py
      - tools/instant-translate/test_inspect_apk.py

permissions:
  contents: read

concurrency:
  group: inspect-instant-translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[instant-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the inspector's pinning and privacy guards
        run: python3 tools/instant-translate/test_inspect_apk.py -v
      - name: Inspect the pinned APK without executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          mkdir -p "$RUNNER_TEMP/instant-input"
          filename='Instant.Translate-v7.5.00300-com.spaceship.screen.textcopy.apk'
          gh release download Instant-translate --pattern "$filename" --dir "$RUNNER_TEMP/instant-input"
          echo "f341a1b174bda7b5d1c95cb2fc84da238228a116844069ee962220acaf1e4e4c  $RUNNER_TEMP/instant-input/$filename" | sha256sum --check
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$tools_dir/apksigner"
          if ! python3 tools/instant-translate/inspect_apk.py "$RUNNER_TEMP/instant-input/$filename" \
            "$RUNNER_TEMP/instant-inventory.json" --apksigner "$tools_dir/apksigner" > "$RUNNER_TEMP/instant-inspect.log" 2>&1; then
            tail -n 15 "$RUNNER_TEMP/instant-inspect.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/instant-inspect.log"
      - name: Report sanitized static findings
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path
          raw = (Path(os.environ['RUNNER_TEMP']) / 'instant-inventory.json').read_bytes()
          data = base64.b64encode(gzip.compress(raw)).decode('ascii')
          chunks = [data[i:i + 3900] for i in range(0, len(data), 3900)]
          if len(chunks) > 9:
              raise SystemExit('Sanitized inventory exceeds annotation capacity')
          for i, chunk in enumerate(chunks, 1):
              print(f'::notice::INSTANT_INVENTORY {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: instant-translate-static-inventory
          path: ${{ runner.temp }}/instant-inventory.json
