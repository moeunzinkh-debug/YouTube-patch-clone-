name: Publish Instant Translate 0.4.0-dev.1 bundle

on:
  push:
    branches:
      - arena/a54bcff2-youtube-patch-clone
    paths:
      - .github/workflows/attach-instant-translate-bundle.yml
      - tools/instant-translate/publish_release.py
      - tools/instant-translate/test_publish_release.py

permissions:
  contents: write

concurrency:
  group: instant-translate-release-assets
  cancel-in-progress: false

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[instant-publish-0.4]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test safe promotion and rollback (offline)
        run: python3 tools/instant-translate/test_publish_release.py -v
      - name: Verify local bundle and checksum (no APKs)
        run: |
          python3 tools/instant-translate/verify_bundle.py --mpp bundles/instant-translate/bundle.mpp
          (cd bundles/instant-translate && sha256sum -c bundle.mpp.sha256)
      - name: Upload, verify, and promote only the bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/instant-translate/publish_release.py \
            --bundle bundles/instant-translate/bundle.mpp \
            --checksum bundles/instant-translate/bundle.mpp.sha256 \
            --temp "$RUNNER_TEMP/instant-release" \
            --report "$RUNNER_TEMP/instant-release-report.json"
      - name: Save publication report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: instant-translate-0.4.0-release-report
          path: ${{ runner.temp }}/instant-release-report.json
          if-no-files-found: error
          retention-days: 14
