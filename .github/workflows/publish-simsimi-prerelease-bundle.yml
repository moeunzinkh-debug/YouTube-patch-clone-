name: Publish SimSimi pre-release bundle
on:
  workflow_dispatch:
  push:
    branches: [arena/2d29b958-youtube-patch-clone]
    paths: ['.github/workflows/publish-simsimi-prerelease-bundle.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact bundle
        run: |
          (cd bundles/simsimi && sha256sum -c bundle.mpp.sha256)
          test "$(stat -c %s bundles/simsimi/bundle.mpp)" = 79181
          test "$(cut -d' ' -f1 bundles/simsimi/bundle.mpp.sha256)" = 80fa1fab22be72cf99b8fcae9cddf0115c422011a2ee3dcf46628e2e3dfd9de2
      - name: Add bundle to SimSimi pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload Simsimi \
            bundles/simsimi/bundle.mpp \
            bundles/simsimi/bundle.mpp.sha256 \
            --clobber
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view Simsimi --json isPrerelease,assets > /tmp/release.json
          python3 - <<'PY'
          import json
          release = json.load(open('/tmp/release.json'))
          assert release['isPrerelease'] is True
          assets = {item['name']: item['size'] for item in release['assets']}
          assert assets['Simsimi_9.2.6.apk'] == 108057119
          assert assets['bundle.mpp'] == 79181
          assert assets['bundle.mpp.sha256'] > 64
          print(assets)
          PY
