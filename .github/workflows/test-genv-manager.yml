name: Test GenV bundle in Morphe Manager
# Import the source-matched MPP and verify both selectors on a disposable base.

on:
  push:
    branches: [arena/3655779f-youtube-patch-clone]
    paths:
      - 'tools/genv/test_manager.py'
      - 'tools/genv/verify_manager_output.py'
      - '.github/workflows/test-genv-manager.yml'

permissions:
  contents: read
  actions: read

jobs:
  manager:
    if: contains(github.event.head_commit.message, '[genv-manager]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the source-matched bundle, Manager and original base APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/genv-manager
          run="$(python3 tools/king-patcher/find_successful_run.py \
            "$GITHUB_REF_NAME" build-genv-mpp.yml \
            tools/genv/project tools/genv/prepare_build.py tools/genv/verify_bundle.py tools/genv/verify_patched.py tools/genv/verify_microg_patched.py tools/genv/inspect_genv.py .github/workflows/build-genv-mpp.yml)"
          gh run download "$run" -n genv-morphe-bundle-static-only --dir /tmp/genv-manager
          python3 tools/genv/verify_bundle.py --mpp /tmp/genv-manager/bundle.mpp --listing /tmp/genv-manager/patches.txt
          gh release download v2.3.0-dev.3 --repo MorpheApp/morphe-manager --pattern morphe-manager-2.3.0-dev.3.apk --dir /tmp/genv-manager
          gh release download GenV --pattern GenV_3.7.2.apk --dir /tmp/genv-manager
          echo '9b9cbd8d3e0c4394f87c1a5675db6ff2e473233e316bf2915f6fe447347e5d96  /tmp/genv-manager/morphe-manager-2.3.0-dev.3.apk' | sha256sum --check
          echo 'f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e  /tmp/genv-manager/GenV_3.7.2.apk' | sha256sum --check
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
      - name: Preinstall the emulator image with retry for transient download corruption
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if ! test -x "$sdkmanager"; then
            sdkmanager="$(find -L "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          fi
          test -x "$sdkmanager"
          for attempt in 1 2 3; do
            if "$sdkmanager" --install 'system-images;android-35;google_apis;x86_64' --channel=0 > /tmp/genv-manager/sdk-image.log 2>&1; then
              echo 'Emulator image available'
              exit 0
            fi
            echo "::warning::System image download failed on attempt $attempt"
          done
          tail -n 15 /tmp/genv-manager/sdk-image.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
      - name: Enable KVM for an Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Import the MPP and patch the incomplete base, without running GenV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/genv/test_manager.py
      - name: Verify Manager output and input integrity
        shell: bash
        run: |
          set -euo pipefail
          if ! python3 tools/genv/verify_manager_output.py /tmp/genv-manager/GenV_3.7.2.apk \
            /tmp/genv-manager/manager-patched-base.apk /tmp/genv-manager/bundle.mpp /tmp/genv-manager/manager-smoke.json > /tmp/genv-manager/verify.log 2>&1; then
            tail -n 20 /tmp/genv-manager/verify.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat /tmp/genv-manager/verify.log
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify --verbose /tmp/genv-manager/manager-patched-base.apk > /tmp/genv-manager/signature.txt
          echo '::notice::Manager signed the disposable base; required splits, full installation, and GenV runtime were not tested.'
      - uses: actions/upload-artifact@v4
        with:
          name: genv-manager-smoke
          if-no-files-found: error
          path: /tmp/genv-manager/manager-smoke.json
