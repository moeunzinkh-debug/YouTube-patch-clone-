name: Inspect GenV account and password indicators
# Read-only analysis of the pinned release base only. No account, token, app
# execution, login requests, APK modification or APK publication.
on:
  push:
    branches: [arena/3655779f-youtube-patch-clone]
    paths:
      - 'tools/genv/inspect_account_login.py'
      - 'tools/genv/test_inspect_account_login.py'
      - '.github/workflows/inspect-genv-account.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[genv-account-inspection]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test privacy and fixed-label guards
        run: |
          set -euo pipefail
          python3 tools/genv/test_inspect_account_login.py -v
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
      - name: Inspect pinned original base without executing or modifying it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/genv-account"
          gh release download GenV --pattern GenV_3.7.2.apk --dir "$RUNNER_TEMP/genv-account"
          echo 'f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e  '"$RUNNER_TEMP/genv-account/GenV_3.7.2.apk" | sha256sum --check
          if ! python3 tools/genv/inspect_account_login.py "$RUNNER_TEMP/genv-account/GenV_3.7.2.apk" "$RUNNER_TEMP/genv-account/report.json" > "$RUNNER_TEMP/genv-account/inspect.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/genv-account/inspect.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/genv-account/inspect.log"
          python3 - <<'PY'
          import base64,gzip,os
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'genv-account/report.json').read_bytes()
          payload=base64.b64encode(gzip.compress(raw)).decode()
          chunks=[payload[i:i+3900] for i in range(0,len(payload),3900)]
          if len(chunks)>10: raise SystemExit('Bounded report exceeds annotation limit')
          for i,chunk in enumerate(chunks,1): print(f'::notice::GENV_ACCOUNT {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genv-account-base-inspection
          if-no-files-found: error
          path: ${{ runner.temp }}/genv-account/report.json
