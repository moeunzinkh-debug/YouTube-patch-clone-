name: Trace GenV Google sign-in and verify Morphe MicroG RE

on:
  push:
    branches: [arena/3655779f-youtube-patch-clone]
    paths:
      - 'tools/genv/trace_google_auth.py'
      - '.github/workflows/trace-genv-google-auth.yml'

permissions:
  contents: read

jobs:
  trace:
    if: contains(github.event.head_commit.message, '[genv-auth-trace]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect only approved code and public signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/genv/test_inspect_google_auth.py -v
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          mkdir -p "$RUNNER_TEMP/genv-auth-trace"
          gh release download GenV --pattern GenV_3.7.2.apk --dir "$RUNNER_TEMP/genv-auth-trace"
          gh release download 7.3.0 --repo MorpheApp/MicroG-RE --pattern microg-7.3.0-icon-arm64-v8a.apk --dir "$RUNNER_TEMP/genv-auth-trace"
          apk="$RUNNER_TEMP/genv-auth-trace/GenV_3.7.2.apk"
          microg="$RUNNER_TEMP/genv-auth-trace/microg-7.3.0-icon-arm64-v8a.apk"
          echo 'f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e  '"$apk" | sha256sum --check
          echo 'c0007dd1c70e0e9532daffdd16a84670779abfeeaf3a62802e5af5bdb3798962  '"$microg" | sha256sum --check
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$tools/apksigner" && test -x "$tools/aapt"
          if ! python3 tools/genv/trace_google_auth.py "$apk" "$RUNNER_TEMP/genv-auth-trace/report.json" --apksigner "$tools/apksigner" > "$RUNNER_TEMP/genv-auth-trace/trace.log" 2>&1; then
            tail -n 25 "$RUNNER_TEMP/genv-auth-trace/trace.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          "$tools/aapt" dump badging "$microg" > "$RUNNER_TEMP/genv-auth-trace/microg-package.txt"
          python3 - "$microg" "$tools/apksigner" "$RUNNER_TEMP/genv-auth-trace/microg-package.txt" "$RUNNER_TEMP/genv-auth-trace/report.json" <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,'tools/genv')
          from trace_google_auth import signature_lines
          microg,signer,package_file,report_path=sys.argv[1:]
          line=Path(package_file).read_text()
          m=re.search(r"name='([^']+)'",line)
          if not m or m[1]!='app.revanced.android.gms': raise SystemExit('Unexpected Morphe MicroG package')
          report=json.loads(Path(report_path).read_text())
          report['microg_reference']={'repository':'MorpheApp/MicroG-RE','tag':'7.3.0','package':m[1],
              'apk_sha256':'c0007dd1c70e0e9532daffdd16a84670779abfeeaf3a62802e5af5bdb3798962',
              'signature':signature_lines(signer,Path(microg))}
          Path(report_path).write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Emit only sanitized method structure and signer digests
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'genv-auth-trace/report.json').read_text())
          def encode(): return base64.b64encode(gzip.compress(json.dumps(report).encode())).decode()
          payload=encode()
          if len(payload)>35000:
              for v in report['selected_methods'].values(): v['references']=v['references'][:40]
              payload=encode()
          chunks=[payload[i:i+3900] for i in range(0,len(payload),3900)]
          if len(chunks)>10: raise SystemExit('Bounded trace exceeds annotation limit')
          for i,chunk in enumerate(chunks,1): print(f'::notice::GENV_AUTH_TRACE {i}/{len(chunks)} {chunk}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genv-auth-trace
          if-no-files-found: error
          path: ${{ runner.temp }}/genv-auth-trace/report.json
