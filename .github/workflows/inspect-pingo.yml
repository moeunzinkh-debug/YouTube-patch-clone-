name: Inspect Pingo AI pre-release APK

on:
  push:
    branches: [arena/269504a5-youtube-patch-clone]
    paths:
      - 'tools/pingo/inspect_apk.py'
      - '.github/workflows/inspect-pingo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pingo-inspect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download and pin exact release asset
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pingo"
          gh release download Pingo --pattern 'Pingo_5.4.8.apk' --dir "$RUNNER_TEMP/pingo"
          echo '1ef37fd47d97dae52318ea0a084652d375bccc277e394ab298ab9014234a1c57  '"$RUNNER_TEMP/pingo/Pingo_5.4.8.apk" | sha256sum --check
          test "$(stat -c %s "$RUNNER_TEMP/pingo/Pingo_5.4.8.apk")" = 72566868
      - name: Inspect manifest, DEX, PairIP, and entitlement candidates
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          python3 tools/pingo/inspect_apk.py "$RUNNER_TEMP/pingo/Pingo_5.4.8.apk" docs/pingo/apk-inspection.json
      - uses: actions/upload-artifact@v4
        with:
          name: pingo-static-inspection
          path: docs/pingo/apk-inspection.json
      - name: Save non-APK evidence
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git merge --ff-only FETCH_HEAD
          if [ "$(git rev-parse "$GITHUB_SHA:tools/pingo/inspect_apk.py")" != "$(git rev-parse "HEAD:tools/pingo/inspect_apk.py")" ]; then
            echo '::warning::Pingo inspection source changed; refusing stale evidence.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/pingo/apk-inspection.json
          git diff --cached --quiet && exit 0
          git commit -m 'analysis: inspect exact Pingo AI APK [skip ci]'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
