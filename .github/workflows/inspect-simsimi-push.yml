name: Inspect SimSimi and microG RE push compatibility
on:
  push:
    branches: [arena/0b9fd265-youtube-patch-clone]
    paths: ['tools/simsimi/inspect_push_compat.py', 'tools/simsimi/test_push_compat.py', '.github/workflows/inspect-simsimi-push.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[simsimi-push-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare public APK manifests and native push paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/simsimi-push
          gh release download Simsimi --pattern base.2.apk --dir /tmp/simsimi-push
          gh release download microg-re-v7.3.0-dev.2 --repo moeunzinkh-debug/MicroG-Re-Rebuild- \
            --pattern microg-7.3.0-dev.2-icon-arm64-v8a.apk --dir /tmp/simsimi-push
          gh release download microg-original-hw-v0.3.17.255070 --repo moeunzinkh-debug/MicroG-Re-Rebuild- \
            --pattern com.google.android.gms-255070302-hw-arm64-v8a.apk --dir /tmp/simsimi-push
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop \
            --pattern morphe-desktop-1.19.1-all.jar --dir /tmp/simsimi-push
          echo 'f18da384232c8e918e1073fd2e95cde6dda9bda2a34f4f90bb527ca95ea8af70  /tmp/simsimi-push/base.2.apk' | sha256sum --check
          echo 'b650b0325de4d80606597003d64ac7b358489c4e5eba6b76dfdc0008e0ca47e4  /tmp/simsimi-push/microg-7.3.0-dev.2-icon-arm64-v8a.apk' | sha256sum --check
          echo 'a8c5f8cd1845394f77d657ffdbff843bfb3ad86dcd1cc4afdac75cf098b46709  /tmp/simsimi-push/com.google.android.gms-255070302-hw-arm64-v8a.apk' | sha256sum --check
          echo 'a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  /tmp/simsimi-push/morphe-desktop-1.19.1-all.jar' | sha256sum --check
          (cd bundles/simsimi && sha256sum --check bundle.mpp.sha256)
          if ! java -Xmx4g -jar /tmp/simsimi-push/morphe-desktop-1.19.1-all.jar patch /tmp/simsimi-push/base.2.apk \
            -p bundles/simsimi/bundle.mpp -e 'MicroG RE service routing (experimental)' \
            --exclusive --unsigned -o /tmp/simsimi-push/patched.apk >/tmp/simsimi-push/patch.log 2>&1; then
            tail -n 9 /tmp/simsimi-push/patch.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          python -m pip install --disable-pip-version-check 'androguard==4.1.3'
          python tools/simsimi/test_push_compat.py
          if ! python tools/simsimi/inspect_push_compat.py /tmp/simsimi-push/base.2.apk /tmp/simsimi-push/patched.apk \
            /tmp/simsimi-push/microg-7.3.0-dev.2-icon-arm64-v8a.apk \
            /tmp/simsimi-push/com.google.android.gms-255070302-hw-arm64-v8a.apk /tmp/simsimi-push/report.json \
            >/tmp/simsimi-push/inspect.log 2>&1; then
            tail -n 9 /tmp/simsimi-push/inspect.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = base64.b64encode(gzip.compress(Path('/tmp/simsimi-push/report.json').read_bytes())).decode('ascii')
          # GitHub allows ten annotations per step and truncates at 4096 characters each.
          chunks = [data[i:i + 3900] for i in range(0, len(data), 3900)]
          if len(chunks) > 10:
              raise SystemExit('Sanitized report is too large for CI annotations')
          for i, chunk in enumerate(chunks, 1):
              print(f'::notice::SIMSIMI_PUSH_ABI {i}/{len(chunks)} {chunk}')
          PY
