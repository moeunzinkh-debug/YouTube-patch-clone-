name: Build and validate the GenV Morphe bundle

on:
  push:
    branches: [arena/02093a53-youtube-patch-clone]
    paths:
      - 'tools/genv/project/**'
      - 'tools/genv/prepare_build.py'
      - 'tools/genv/verify_bundle.py'
      - 'tools/genv/verify_patched.py'
      - 'tools/genv/test_patch_tools.py'
      - 'tools/genv/inspect_genv.py'
      - '.github/workflows/build-genv-mpp.yml'

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: contains(github.event.head_commit.message, '[genv-build]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test guards and prepare an isolated bundle build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/genv/test_inspect_genv.py -v
          python3 tools/genv/test_patch_tools.py -v
          python3 tools/genv/prepare_build.py "$RUNNER_TEMP/genv-build"
          mkdir -p "$RUNNER_TEMP/genv-tools" "$RUNNER_TEMP/genv-output"
          gh release download v9.8.2 --repo gradle/gradle-distributions --pattern gradle-9.8.2-bin.zip --dir "$RUNNER_TEMP/genv-tools"
          echo '21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607  '"$RUNNER_TEMP/genv-tools/gradle-9.8.2-bin.zip" | sha256sum --check
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$RUNNER_TEMP/genv-tools/gradle-9.8.2-bin.zip|" "$RUNNER_TEMP/genv-build/gradle/wrapper/gradle-wrapper.properties"
      - name: Build the standalone Android-compatible MPP
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/genv-build"
          ./gradlew :patches:buildAndroid --no-daemon --max-workers=2 --stacktrace 2>&1 | tee "$RUNNER_TEMP/genv-build.log"
      - name: Report build diagnostics
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/genv-build.log"; then
            grep -Ei -A 5 '^e:|^error:| error:|what went wrong|execution failed|could not|failed|failure:|exception|timeout' "$RUNNER_TEMP/genv-build.log" | tail -45 | while IFS= read -r line; do echo "::error::$line"; done || true
          fi
      - name: Verify the selector and patch a disposable copy of the release APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find "$RUNNER_TEMP/genv-build/patches/build/libs" -maxdepth 1 -name '*.mpp' -type f)
          test "${#candidates[@]}" -eq 1
          cp "${candidates[0]}" "$RUNNER_TEMP/genv-output/bundle.mpp"
          (cd "$RUNNER_TEMP/genv-output" && sha256sum bundle.mpp > bundle.mpp.sha256)
          gh release download v1.20.0-dev.1 --repo MorpheApp/morphe-desktop --pattern morphe-desktop-1.20.0-dev.1-all.jar --dir "$RUNNER_TEMP/genv-tools"
          gh release download GenV --pattern GenV_3.7.2.apk --dir "$RUNNER_TEMP/genv-tools"
          echo '20c2cf951373f4e47092a7c9312519ecfd4b2826ddc114b134e0ad503af53fdb  '"$RUNNER_TEMP/genv-tools/morphe-desktop-1.20.0-dev.1-all.jar" | sha256sum --check
          echo 'f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e  '"$RUNNER_TEMP/genv-tools/GenV_3.7.2.apk" | sha256sum --check
          cli="$RUNNER_TEMP/genv-tools/morphe-desktop-1.20.0-dev.1-all.jar"
          java -Xmx2g -jar "$cli" list-patches --patches "$RUNNER_TEMP/genv-output/bundle.mpp" \
            --with-packages --with-versions --include-experimental --out "$RUNNER_TEMP/genv-output/patches.txt"
          python3 tools/genv/verify_bundle.py --mpp "$RUNNER_TEMP/genv-output/bundle.mpp" --listing "$RUNNER_TEMP/genv-output/patches.txt"
          if ! java -Xmx4g -jar "$cli" patch "$RUNNER_TEMP/genv-tools/GenV_3.7.2.apk" \
              --patches "$RUNNER_TEMP/genv-output/bundle.mpp" --exclusive -e 'Remove license check' \
              --unsigned --bytecode-mode FULL --out "$RUNNER_TEMP/genv-tools/modified-base.apk" \
              --result-file "$RUNNER_TEMP/genv-tools/patch-result.json" > "$RUNNER_TEMP/genv-tools/patch.log" 2>&1; then
            tail -n 35 "$RUNNER_TEMP/genv-tools/patch.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          if ! python3 tools/genv/verify_patched.py "$RUNNER_TEMP/genv-tools/GenV_3.7.2.apk" \
              "$RUNNER_TEMP/genv-tools/modified-base.apk" "$RUNNER_TEMP/genv-tools/patch-result.json" \
              "$RUNNER_TEMP/genv-output/patch-validation.json" > "$RUNNER_TEMP/genv-tools/verify.log" 2>&1; then
            tail -n 25 "$RUNNER_TEMP/genv-tools/verify.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/genv-tools/verify.log"
          # Reapplying to the changed implementation must fail closed, not patch a second time.
          if java -Xmx4g -jar "$cli" patch "$RUNNER_TEMP/genv-tools/modified-base.apk" \
              --patches "$RUNNER_TEMP/genv-output/bundle.mpp" --exclusive -e 'Remove license check' \
              --unsigned --bytecode-mode FULL --out "$RUNNER_TEMP/genv-tools/repatch.apk" \
              --result-file "$RUNNER_TEMP/genv-tools/repatch-result.json" > "$RUNNER_TEMP/genv-tools/repatch.log" 2>&1; then
            echo '::error::An already modified implementation was unexpectedly accepted'
            exit 1
          fi
          if ! grep -q 'GenV checkLicense implementation changed or is already patched' "$RUNNER_TEMP/genv-tools/repatch.log"; then
            tail -n 35 "$RUNNER_TEMP/genv-tools/repatch.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo '::notice::Fail-closed guard rejected an already modified GenV method.'
          echo '::notice::Both PairIP entry points were modified in a disposable base APK; selected controls and manifest were verified.'
          echo '::notice::The source APK requires splits. No APK was installed, uploaded or published.'
      - uses: actions/upload-artifact@v4
        with:
          name: genv-morphe-bundle-static-only
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/genv-output/bundle.mpp
            ${{ runner.temp }}/genv-output/bundle.mpp.sha256
            ${{ runner.temp }}/genv-output/patches.txt
            ${{ runner.temp }}/genv-output/patch-validation.json
