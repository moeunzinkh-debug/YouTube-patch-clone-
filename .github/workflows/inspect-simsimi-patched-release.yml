name: Inspect published SimSimi APK hook

on:
  push:
    branches: [arena/2d29b958-youtube-patch-clone]
    paths:
      - 'tools/simsimi/inspect_patched_release.py'
      - '.github/workflows/inspect-simsimi-patched-release.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[simsimi-patched-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare public original and candidate APKs without executing them
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/simsimi-published"
          mkdir -p "$work"
          gh release download Simsimi --pattern base.2.apk --pattern Simsimi_9.2.3.apk --dir "$work"
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
          python3 tools/simsimi/inspect_patched_release.py \
            "$work/base.2.apk" "$work/Simsimi_9.2.3.apk" "$work/report.json"
          python3 - "$work/report.json" <<'PY'
          import base64,gzip,pathlib,sys
          data=base64.b64encode(gzip.compress(pathlib.Path(sys.argv[1]).read_bytes())).decode()
          chunks=[data[i:i+3900] for i in range(0,len(data),3900)]
          if len(chunks)>10: raise SystemExit('Sanitized report too large')
          for i,chunk in enumerate(chunks,1): print(f'::notice::SIMSIMI_PATCHED_APK {i}/{len(chunks)} {chunk}')
          PY
          echo '::notice::Neither public APK was installed, launched, modified or uploaded as an artifact.'
