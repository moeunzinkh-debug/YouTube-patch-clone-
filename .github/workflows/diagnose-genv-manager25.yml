name: Diagnose GenV signer guard in Manager 2.5.0
# Source-matched, account-free diagnostic: original incomplete base and a
# single-module archive that forces Manager's merger. No GenV APK is published.
on:
  push:
    branches: [arena/3655779f-youtube-patch-clone]
    paths:
      - 'tools/genv/test_manager.py'
      - 'tools/genv/verify_manager25.py'
      - '.github/workflows/diagnose-genv-manager25.yml'
permissions:
  contents: read
  actions: read
jobs:
  manager:
    if: contains(github.event.head_commit.message, '[genv-manager25]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [base, single-module-archive]
    env:
      GH_TOKEN: ${{ github.token }}
      GENV_MANAGER_FILE: morphe-manager-2.5.0.apk
      GENV_MICROG_ONLY: '1'
      GENV_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download source-matched bundle, original input and exact Manager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/genv-manager
          run="$(python3 tools/king-patcher/find_successful_run.py "$GITHUB_REF_NAME" build-genv-mpp.yml \
            tools/genv/project tools/genv/prepare_build.py tools/genv/verify_bundle.py tools/genv/verify_patched.py \
            tools/genv/verify_microg_patched.py tools/genv/inspect_genv.py .github/workflows/build-genv-mpp.yml)"
          gh run download "$run" --name genv-morphe-bundle-static-only --dir /tmp/genv-manager
          python3 tools/genv/verify_bundle.py --mpp /tmp/genv-manager/bundle.mpp --listing /tmp/genv-manager/patches.txt
          gh release download v2.5.0 --repo MorpheApp/morphe-manager --pattern morphe-manager-2.5.0.apk --dir /tmp/genv-manager
          gh release download GenV --pattern GenV_3.7.2.apk --dir /tmp/genv-manager
          echo '681a1c179b9e8698c857a092df0ca9a91e294a103743107f4fe96da20cb42ddc  /tmp/genv-manager/morphe-manager-2.5.0.apk' | sha256sum --check
          echo 'f50a9d162a5802ce30ba842c09d08c8c2b2c816dc439eb1b8c0346aa71501d2e  /tmp/genv-manager/GenV_3.7.2.apk' | sha256sum --check
          if [[ "$GENV_MODE" == single-module-archive ]]; then
            python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/genv-manager/base-only.apks', 'w', compression=zipfile.ZIP_STORED) as archive:
              archive.write('/tmp/genv-manager/GenV_3.7.2.apk', 'base.apk')
          PY
            echo 'GENV_INPUT_FILE=base-only.apks' >> "$GITHUB_ENV"
          else
            echo 'GENV_INPUT_FILE=GenV_3.7.2.apk' >> "$GITHUB_ENV"
          fi
          python3 -m pip install --disable-pip-version-check 'androguard==4.1.3'
      - name: Preinstall Android 10 emulator image with retry
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if ! test -x "$sdkmanager"; then sdkmanager="$(find -L "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"; fi
          test -x "$sdkmanager"
          for attempt in 1 2 3; do
            if "$sdkmanager" --install 'system-images;android-29;google_apis;x86_64' --channel=0 > /tmp/genv-manager/sdk-image.log 2>&1; then exit 0; fi
            echo "::warning::Emulator image download failed on attempt $attempt"
          done
          tail -n 15 /tmp/genv-manager/sdk-image.log
          exit 1
      - name: Enable emulator acceleration
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo '::warning::KVM unavailable'; fi
      - name: Import the MPP and patch with only MicroG selected
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10G
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/genv/test_manager.py
      - name: Verify MicroG-only output and source integrity
        run: |
          set -euo pipefail
          python3 tools/genv/verify_manager25.py /tmp/genv-manager/GenV_3.7.2.apk /tmp/genv-manager/manager-patched-base.apk /tmp/genv-manager/bundle.mpp "$GENV_MODE" /tmp/genv-manager/manager25-${GENV_MODE}.json
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$apksigner" verify --verbose /tmp/genv-manager/manager-patched-base.apk > /tmp/genv-manager/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genv-manager25-${{ matrix.mode }}
          if-no-files-found: error
          path: /tmp/genv-manager/manager25-${{ matrix.mode }}.json
