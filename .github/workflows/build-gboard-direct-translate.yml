name: Experimental Gboard direct-Translate fork

on:
  workflow_dispatch:
  push:
    branches: [arena/69154a0c-youtube-patch-clone]
    paths:
      - 'tools/gboard-translate/**'
      - '.github/workflows/build-gboard-direct-translate.yml'

permissions:
  contents: write
  packages: read

concurrency:
  group: gboard-direct-translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gboard-direct-ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify upstream and create an isolated fork
        run: |
          set -euo pipefail
          python3 tools/gboard/verify_bundle.py --verify-vendor
          python3 tools/gboard-translate/test_fixture.py
          python3 tools/gboard-translate/apply_overlay.py /tmp/gboard-direct-source
      - name: Compile fork, verify runtime ABI, build MPP and generate metadata
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: /tmp/gboard-direct-source
        run: |
          set -o pipefail
          ./gradlew :patches:test --tests '*runtimeabi.*' :patches:buildAndroid generatePatchesList \
            --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/gboard-direct-build.log
      - name: Test POST parsing, failures, callbacks, and stale-result handling
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: /tmp/gboard-direct-source
        run: |
          set -o pipefail
          ./gradlew :extensions:extension:testDebugUnitTest --tests '*directtranslate.*' \
            --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/gboard-direct-unit.log
      - name: Probe the Java HTTPS client with synthetic text only
        id: live-probe
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          GBOARD_DIRECT_LIVE_PROBE: '1'
        working-directory: /tmp/gboard-direct-source
        run: |
          set -o pipefail
          if ! ./gradlew :extensions:extension:testDebugUnitTest --tests '*GtxLiveProbeTest' \
            --no-daemon --max-workers=2 --stacktrace 2>&1 | tee /tmp/gboard-direct-live.log; then
            echo '::warning::Synthetic Java POST probe failed or was rate-limited on this runner.'
            exit 1
          fi
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths = glob.glob('extensions/extension/build/test-results/testDebugUnitTest/TEST-*GtxLiveProbeTest.xml')
          assert len(paths) == 1, 'Missing live probe result'
          root = ET.parse(paths[0]).getroot()
          assert root.get('tests') == '1' and root.get('failures') == '0' and root.get('errors') == '0' and root.get('skipped') == '0', root.attrib
          print('::notice::Java HTTPS POST synthetic English→Khmer, Khmer→English and auto→Khmer all passed on the CI runner.')
          PY
      - name: Load fork with Morphe Desktop and verify all 44 registrations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Morphe fork listing failed at line $LINENO (exit $status)"; for f in /tmp/gboard-direct-list.log /tmp/gboard-direct-verify.log; do if test -f "$f"; then tail -12 "$f" | while IFS= read -r line; do echo "::error::$line"; done; fi; done' ERR
          mkdir -p /tmp/gboard-direct-input /tmp/gboard-direct-output
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop \
            --pattern morphe-desktop-1.19.1-all.jar --dir /tmp/gboard-direct-input
          echo 'a51472252cd63b2eac635dbb5a154ff918bfc15268da89679feb3d760230c573  /tmp/gboard-direct-input/morphe-desktop-1.19.1-all.jar' | sha256sum --check
          mpp=/tmp/gboard-direct-source/patches/build/libs/patches-4.0.0-direct-translate-dev.1.mpp
          test -s "$mpp" || { echo '::error::The binary MPP was not produced (do not use the sources MPP).'; exit 1; }
          echo "::notice::Built MPP: $mpp"
          cp "$mpp" /tmp/gboard-direct-output/gboard-direct-translate-experimental.mpp
          cp /tmp/gboard-direct-source/patches-list.json /tmp/gboard-direct-output/patches-list.json
          java -Xmx2g -jar /tmp/gboard-direct-input/morphe-desktop-1.19.1-all.jar list-patches \
            --patches /tmp/gboard-direct-output/gboard-direct-translate-experimental.mpp \
            --with-packages --with-versions --out /tmp/gboard-direct-output/desktop-patches.txt \
            2>&1 | tee /tmp/gboard-direct-list.log
          python3 tools/gboard-translate/verify_artifact.py \
            /tmp/gboard-direct-output/gboard-direct-translate-experimental.mpp \
            /tmp/gboard-direct-output/patches-list.json /tmp/gboard-direct-output/desktop-patches.txt \
            2>&1 | tee /tmp/gboard-direct-verify.log
      - name: Make a test-only fixture from the pinned third-party prepatched APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'androguard==4.1.3'
          gh release download 'gboard-v18.5.4.993608717-release-arm64-v8a-p4.0.0' \
            --repo iamwaqargulzar/auto-morphe-apk-builds \
            --pattern 'gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk' \
            --dir /tmp/gboard-direct-input
          input=/tmp/gboard-direct-input/gboard-18.5.4.993608717-release-arm64-v8a-arm64-v8a.apk
          echo "1d9260f74430265bcf4087ae45d6a22f688d907fd5ed84998ea15d4eac4e93ea  $input" | sha256sum --check
          python3 tools/gboard-translate/make_manifest_fixture.py "$input" /tmp/gboard-direct-input/fixture.apk
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt" dump badging /tmp/gboard-direct-input/fixture.apk | sed -n '1p' > /tmp/gboard-direct-input/fixture-badging.txt
          grep -F "name='com.google.android.inputmethod.latin' versionCode='176049702' versionName='18.5.4.993608717-release-arm64-v8a'" /tmp/gboard-direct-input/fixture-badging.txt
          echo '::notice::Fixture is derived from a third-party prepatched APK, not stock; it is not an Android test.'
      - name: Apply the actual MPP with Morphe Desktop and inspect resulting DEX
        run: |
          set -o pipefail
          java -Xmx3g -jar /tmp/gboard-direct-input/morphe-desktop-1.19.1-all.jar patch \
            --patches /tmp/gboard-direct-output/gboard-direct-translate-experimental.mpp \
            --exclusive --enable 'Direct Google Translate (experimental)' \
            --bytecode-mode FULL --out /tmp/gboard-direct-output/fixture-patched.apk \
            --result-file /tmp/gboard-direct-output/patch-result.json \
            /tmp/gboard-direct-input/fixture.apk 2>&1 | tee /tmp/gboard-direct-apply.log
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/gboard-direct-output/patch-result.json'))
          assert result['success'] and not result['failedPatches'], result.get('failureReason')
          assert 'Direct Google Translate (experimental)' in result['appliedPatches'], result['appliedPatches']
          print('Morphe applied the experimental patch and rebuilt the test fixture successfully.')
          PY
          python3 tools/gboard-translate/verify_fixture_apk.py /tmp/gboard-direct-output/fixture-patched.apk
      - name: Write an honest validation report
        env:
          LIVE_PROBE_OUTCOME: ${{ steps.live-probe.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path('/tmp/gboard-direct-output')
          asset = output / 'gboard-direct-translate-experimental.mpp'
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          (output / (asset.name + '.sha256')).write_text(f'{digest}  {asset.name}\n')
          report = {
              'version': '4.0.0-direct-translate-dev.1', 'experimental': True,
              'upstream_commit': '2eb71854accc7e906d3e4f5495b2a54ed1e2af47',
              'upstream_tree': 'b8dc2c76f8a17259c2e3eaa6b9f8565fb19d730b',
              'sha256': digest, 'size': asset.stat().st_size,
              'morphe_desktop': '1.19.1',
              'checks': {
                  'upstream_43_metadata_and_default_state': 'passed',
                  'experimental_patch_opt_in_and_abi_inventory': 'passed',
                  'post_parser_errors_callback_and_cancellation_unit_tests': 'passed',
                  'java_synthetic_en_km_auto_post_on_ci_runner': os.environ['LIVE_PROBE_OUTCOME'],
                  'morphe_application_to_third_party_prepatched_fixture': 'passed',
                  'patched_fixture_dex_markers': 'passed',
                  'original_google_signed_apk_application': 'not tested',
                  'android_device_runtime_and_user_network': 'not tested',
              },
              'fixture': {
                  'source': 'third-party prepatched and renamed Gboard; manifest package changed only for test selection',
                  'input_sha256': '1d9260f74430265bcf4087ae45d6a22f688d907fd5ed84998ea15d4eac4e93ea',
                  'is_official_stock': False,
              },
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          (output / 'validation.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Save only the experimental MPP and sanitized report to this branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/69154a0c-youtube-patch-clone'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin "$GITHUB_REF_NAME"
          for path in tools/gboard-translate extras/gboard-patches .github/workflows/build-gboard-direct-translate.yml; do
            if [ "$(git rev-parse "$GITHUB_SHA:$path")" != "$(git rev-parse "HEAD:$path")" ]; then
              echo 'Fork inputs changed during the run; refusing to publish an outdated build.'
              exit 0
            fi
          done
          mkdir -p bundles/gboard-experimental
          cp /tmp/gboard-direct-output/gboard-direct-translate-experimental.mpp* bundles/gboard-experimental/
          cp /tmp/gboard-direct-output/{patches-list.json,validation.json} bundles/gboard-experimental/
          git add -f bundles/gboard-experimental/gboard-direct-translate-experimental.mpp \
            bundles/gboard-experimental/gboard-direct-translate-experimental.mpp.sha256 \
            bundles/gboard-experimental/patches-list.json bundles/gboard-experimental/validation.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: add experimental Gboard direct Translate fork [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
      - name: Surface build and patch failures without APK contents
        if: failure()
        run: |
          for log in /tmp/gboard-direct-build.log /tmp/gboard-direct-unit.log /tmp/gboard-direct-apply.log; do
            if test -f "$log"; then
              grep -E -A 5 'What went wrong|Execution failed|Could not|FAILURE:|^e: |error:|Exception| FAILED|ERROR:|FAILED:' "$log" | tail -50 | while IFS= read -r line; do echo "::error::$line"; done || true
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-gboard-direct-translate-ci
          if-no-files-found: ignore
          path: |
            /tmp/gboard-direct-build.log
            /tmp/gboard-direct-unit.log
            /tmp/gboard-direct-live.log
            /tmp/gboard-direct-list.log
            /tmp/gboard-direct-verify.log
            /tmp/gboard-direct-apply.log
            /tmp/gboard-direct-source/patches/build/test-results/test/*.xml
            /tmp/gboard-direct-source/extensions/extension/build/test-results/testDebugUnitTest/*.xml
            /tmp/gboard-direct-output/patch-result.json
            /tmp/gboard-direct-output/desktop-patches.txt
            /tmp/gboard-direct-output/validation.json
