name: Investigate Telegram patch compatibility
on:
  push:
    branches: [arena/cbe2e9a9-youtube-patch-clone]
    paths:
      - '.github/workflows/test-telegram-compatibility.yml'
      - 'tools/telegram-compat/**'
permissions:
  contents: read
  actions: read
jobs:
  compatibility:
    if: contains(github.event.head_commit.message, '[telegram-compat]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned tools and the previously verified Web APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/telegram-compat
          gh release download v1.20.0-dev.1 --repo MorpheApp/morphe-desktop --pattern morphe-desktop-1.20.0-dev.1-all.jar --dir /tmp/telegram-compat
          gh release download android-12.10.1 --repo LOVECHEN/telegram-release --pattern Telegram-12.10.1.apk --dir /tmp/telegram-compat
          echo '20c2cf951373f4e47092a7c9312519ecfd4b2826ddc114b134e0ad503af53fdb  /tmp/telegram-compat/morphe-desktop-1.20.0-dev.1-all.jar' | sha256sum -c
          echo 'f5e1192725772960cc94b83e54ffd8939f876b2b6e5f21d4a8537eb6fcba50e6  /tmp/telegram-compat/Telegram-12.10.1.apk' | sha256sum -c
          (cd bundles/telegram-email-experimental && sha256sum -c bundle.mpp.sha256)
      - name: Test both relevant selectors with the user's patcher version
        run: python3 tools/telegram-compat/check_desktop.py /tmp/telegram-compat/Telegram-12.10.1.apk org.telegram.messenger.web
      - name: Check a public artifact for an exact original standard Telegram APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/telegram-compat/foreign-source
          if gh run download 40640881249 --repo govinda-rajulu/patch-factory --name source-inputs-telegram-40640881249-1 --dir /tmp/telegram-compat/foreign-source > /tmp/telegram-compat/artifact.log 2>&1; then
            echo '::notice::A public foreign source-input artifact was downloaded; checking its package identity and signature.'
            python3 tools/telegram-compat/inspect_artifact.py /tmp/telegram-compat/foreign-source /tmp/telegram-compat/standard.apk
          else
            echo '::warning::The public source-input artifact was not accessible with this repository token; the standard APK remains untested.'
          fi
          if test -f /tmp/telegram-compat/standard.apk; then
            python3 tools/telegram-compat/check_desktop.py /tmp/telegram-compat/standard.apk org.telegram.messenger
          fi
